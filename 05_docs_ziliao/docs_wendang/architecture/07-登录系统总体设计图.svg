<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">主打团统一登录系统总体设计图</title>
  <desc id="desc">从域名入口、统一身份认证、会话票据、L0 与 L1 Membership、Scope 授权到业务模块的完整架构图。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071221"/>
      <stop offset="0.55" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#07111e"/>
    </linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123d69"/>
      <stop offset="1" stop-color="#102947"/>
    </linearGradient>
    <linearGradient id="greenCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e4f4a"/>
      <stop offset="1" stop-color="#103332"/>
    </linearGradient>
    <linearGradient id="violetCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#403071"/>
      <stop offset="1" stop-color="#29254e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000814" flood-opacity="0.42"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55b8ff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#45dfb1"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f5b94c"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .title { fill:#f6fbff; font-size:34px; font-weight:760; letter-spacing:.4px; }
      .subtitle { fill:#9db3cb; font-size:16px; }
      .eyebrow { fill:#69c4ff; font-size:13px; font-weight:700; letter-spacing:1.8px; }
      .panel-title { fill:#eff8ff; font-size:21px; font-weight:720; }
      .section-note { fill:#8fa7c0; font-size:13px; }
      .node-title { fill:#f8fbff; font-size:16px; font-weight:700; }
      .body { fill:#c8d8e8; font-size:13px; }
      .body-strong { fill:#edf7ff; font-size:13px; font-weight:650; }
      .tiny { fill:#94aac1; font-size:11.5px; }
      .mono { fill:#a8d8ff; font-size:12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .chip-text { fill:#eaf6ff; font-size:11px; font-weight:650; }
      .number { fill:#061523; font-size:13px; font-weight:800; }
      .arrow-label { fill:#8fd0ff; font-size:11px; font-weight:650; }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#background)"/>
  <circle cx="1580" cy="-80" r="420" fill="#15518a" opacity="0.12"/>
  <circle cx="180" cy="1190" r="360" fill="#0c7b64" opacity="0.09"/>

  <text x="54" y="58" class="eyebrow">ZDT-NEXT · IDENTITY ARCHITECTURE · 2026-09-06</text>
  <text x="54" y="101" class="title">主打团统一登录系统｜目标设计图</text>
  <text x="54" y="130" class="subtitle">一个账号（Principal） · 多份业务身份（Membership） · 每次会话固定一份身份与一个 Scope</text>

  <g transform="translate(1320,54)">
    <rect x="0" y="0" width="126" height="28" rx="14" fill="#123d34" stroke="#2dbb91"/>
    <circle cx="16" cy="14" r="5" fill="#45dfb1"/><text x="29" y="18" class="chip-text">已有核心能力</text>
    <rect x="138" y="0" width="126" height="28" rx="14" fill="#4a3514" stroke="#c68b2b"/>
    <circle cx="154" cy="14" r="5" fill="#f5b94c"/><text x="167" y="18" class="chip-text">当前部分接线</text>
    <rect x="276" y="0" width="126" height="28" rx="14" fill="#173753" stroke="#4fa9e9"/>
    <circle cx="292" cy="14" r="5" fill="#55b8ff"/><text x="305" y="18" class="chip-text">目标通用能力</text>
  </g>

  <!-- Panel 1 -->
  <g filter="url(#shadow)">
    <rect x="50" y="160" width="340" height="640" rx="24" fill="#0b1c30" stroke="#243e59"/>
  </g>
  <circle cx="82" cy="198" r="15" fill="#55b8ff"/><text x="78" y="203" class="number">1</text>
  <text x="108" y="205" class="panel-title">入口与商家上下文</text>
  <text x="76" y="229" class="section-note">先识别“从哪里来”，再决定可选身份</text>

  <g>
    <rect x="76" y="255" width="288" height="74" rx="15" fill="url(#blueCard)" stroke="#2d6fa5"/>
    <text x="96" y="280" class="node-title">L0 · 主打团后台</text>
    <text x="96" y="303" class="mono">console.zhudatuan.com</text>
    <text x="96" y="320" class="tiny">Owner / 平台运营人员</text>

    <rect x="76" y="343" width="288" height="82" rx="15" fill="url(#violetCard)" stroke="#6f5ca9"/>
    <text x="96" y="368" class="node-title">L1 · 商家后台</text>
    <text x="96" y="391" class="mono">console.&lt;brand-domain&gt;</text>
    <text x="96" y="410" class="tiny">例：console.hbbtzn.com · L1 Owner</text>

    <rect x="76" y="439" width="288" height="82" rx="15" fill="url(#greenCard)" stroke="#278879"/>
    <text x="96" y="464" class="node-title">消费者商城</text>
    <text x="96" y="487" class="mono">brand.com / *.shop.zhudatuan.com</text>
    <text x="96" y="506" class="tiny">密码 · H5 微信 · 游客转会员</text>

    <rect x="76" y="535" width="288" height="66" rx="15" fill="#17293e" stroke="#34526d"/>
    <text x="96" y="560" class="node-title">微信小程序 / 渠道端</text>
    <text x="96" y="584" class="tiny">独立 Bearer Session，不复用 H5 Cookie</text>
  </g>

  <path d="M220 329 L220 343 M220 425 L220 439 M220 521 L220 535" stroke="#4c6e8d" stroke-width="2" stroke-dasharray="4 5"/>
  <path d="M220 601 L220 628" stroke="#55b8ff" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="76" y="632" width="288" height="124" rx="16" fill="#102d47" stroke="#55b8ff" stroke-width="1.4"/>
    <text x="96" y="659" class="node-title">统一 Domain Binding Resolver</text>
    <text x="96" y="684" class="mono">host → environment + surface</text>
    <text x="96" y="705" class="mono">→ application_id + mall_id</text>
    <text x="96" y="726" class="mono">→ accounts/api/return origin</text>
    <rect x="95" y="737" width="248" height="1" fill="#315675"/>
    <text x="96" y="751" class="tiny">域名只选择上下文，不创造任何权限</text>
  </g>

  <!-- Panel 2 -->
  <g filter="url(#shadow)">
    <rect x="420" y="160" width="570" height="640" rx="24" fill="#0b1c30" stroke="#243e59"/>
  </g>
  <circle cx="452" cy="198" r="15" fill="#45dfb1"/><text x="448" y="203" class="number">2</text>
  <text x="478" y="205" class="panel-title">统一身份中心 · Canonical Identity</text>
  <text x="446" y="229" class="section-note">认证账号 → 选择身份 → 建立可撤销会话 → 安全回跳</text>

  <g>
    <rect x="446" y="255" width="518" height="86" rx="16" fill="#103331" stroke="#2ca98a"/>
    <text x="466" y="282" class="node-title">Auth Web · 统一登录体验</text>
    <rect x="466" y="296" width="84" height="25" rx="12" fill="#17614e"/><text x="483" y="313" class="chip-text">密码 · 已接</text>
    <rect x="558" y="296" width="116" height="25" rx="12" fill="#4a3514"/><text x="574" y="313" class="chip-text">手机 OTP · 后端已备</text>
    <rect x="682" y="296" width="102" height="25" rx="12" fill="#17614e"/><text x="699" y="313" class="chip-text">H5 微信 · 已接</text>
    <rect x="792" y="296" width="150" height="25" rx="12" fill="#342f48"/><text x="806" y="313" class="chip-text">企微扫码 / SSO · 待接</text>
  </g>

  <path d="M705 341 L705 366" stroke="#45dfb1" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

  <g>
    <rect x="446" y="370" width="518" height="172" rx="16" fill="url(#blueCard)" stroke="#377bb2"/>
    <text x="466" y="397" class="node-title">认证与身份选择编排</text>
    <g>
      <circle cx="474" cy="425" r="12" fill="#55b8ff"/><text x="470" y="430" class="number">1</text>
      <text x="496" y="430" class="body-strong">Credential / OTP / Federated Identity → Principal</text>
      <circle cx="474" cy="457" r="12" fill="#55b8ff"/><text x="470" y="462" class="number">2</text>
      <text x="496" y="462" class="body-strong">入口上下文内查询可用 Membership</text>
      <circle cx="474" cy="489" r="12" fill="#55b8ff"/><text x="470" y="494" class="number">3</text>
      <text x="496" y="494" class="body-strong">多身份时由用户明确选择一份</text>
      <circle cx="474" cy="521" r="12" fill="#55b8ff"/><text x="470" y="526" class="number">4</text>
      <text x="496" y="526" class="body-strong">Session 固定 principal + membership + client</text>
    </g>
  </g>

  <path d="M705 542 L705 566" stroke="#45dfb1" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

  <g>
    <rect x="446" y="570" width="250" height="144" rx="16" fill="url(#greenCard)" stroke="#2ca98a"/>
    <text x="466" y="598" class="node-title">数据库型会话</text>
    <text x="466" y="624" class="mono">shop_session · HttpOnly</text>
    <text x="466" y="646" class="mono">shop_csrf · SameSite=Strict</text>
    <text x="466" y="670" class="body">随机 token；数据库只存 hash</text>
    <text x="466" y="692" class="body">TTL 12h · 可撤销 · 设备可追踪</text>

    <rect x="714" y="570" width="250" height="144" rx="16" fill="url(#violetCard)" stroke="#7664af"/>
    <text x="734" y="598" class="node-title">一次性交接票据</text>
    <text x="734" y="624" class="mono">ticket TTL 5m · consume once</text>
    <text x="734" y="646" class="mono">state + nonce + PKCE</text>
    <text x="734" y="670" class="body">绑定当前 Session 与 surface</text>
    <text x="734" y="692" class="body">返回 60s Signed Return Target</text>
  </g>

  <rect x="446" y="732" width="518" height="44" rx="13" fill="#13263a" stroke="#31516d"/>
  <text x="466" y="759" class="body-strong">密码变化 → credential_version；权限变化 → access_version；旧会话自然失效</text>

  <!-- Inter-panel flow arrows -->
  <path d="M364 694 C392 694 394 298 446 298" fill="none" stroke="#55b8ff" stroke-width="2.6" marker-end="url(#arrowBlue)"/>
  <text x="377" y="453" class="arrow-label" transform="rotate(-90 377 453)">入口上下文</text>

  <!-- Panel 3 -->
  <g filter="url(#shadow)">
    <rect x="1020" y="160" width="730" height="640" rx="24" fill="#0b1c30" stroke="#243e59"/>
  </g>
  <circle cx="1052" cy="198" r="15" fill="#55b8ff"/><text x="1048" y="203" class="number">3</text>
  <text x="1078" y="205" class="panel-title">登录后 · 授权与业务数据</text>
  <text x="1046" y="229" class="section-note">每一次业务请求都重新从 Session 解析权威身份与范围</text>

  <g>
    <rect x="1046" y="255" width="678" height="76" rx="16" fill="#102d47" stroke="#4e9cd5"/>
    <text x="1068" y="283" class="node-title">Canonical API Gateway + Operation Contract</text>
    <text x="1068" y="308" class="body">Route · Contract Version · Cookie / Bearer · Request / Trace · SDK</text>
  </g>

  <path d="M1385 331 L1385 354" stroke="#55b8ff" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <g>
    <rect x="1046" y="358" width="420" height="294" rx="16" fill="url(#blueCard)" stroke="#377bb2"/>
    <text x="1068" y="387" class="node-title">Access Pipeline · 权威判定顺序</text>
    <g>
      <circle cx="1076" cy="416" r="11" fill="#55b8ff"/><text x="1072" y="421" class="number">1</text><text x="1097" y="421" class="body-strong">Session：状态 / 有效期 / Credential Version</text>
      <circle cx="1076" cy="450" r="11" fill="#55b8ff"/><text x="1072" y="455" class="number">2</text><text x="1097" y="455" class="body-strong">Audience：Console / Storefront</text>
      <circle cx="1076" cy="484" r="11" fill="#55b8ff"/><text x="1072" y="489" class="number">3</text><text x="1097" y="489" class="body-strong">Membership + Access Version</text>
      <circle cx="1076" cy="518" r="11" fill="#55b8ff"/><text x="1072" y="523" class="number">4</text><text x="1097" y="523" class="body-strong">Role Permission + Explicit Deny</text>
      <circle cx="1076" cy="552" r="11" fill="#55b8ff"/><text x="1072" y="557" class="number">5</text><text x="1097" y="557" class="body-strong">Scope Grant → Mall Context</text>
      <circle cx="1076" cy="586" r="11" fill="#55b8ff"/><text x="1072" y="591" class="number">6</text><text x="1097" y="591" class="body-strong">Capability + Assurance / Step-up</text>
      <circle cx="1076" cy="620" r="11" fill="#55b8ff"/><text x="1072" y="625" class="number">7</text><text x="1097" y="625" class="body-strong">Risk / Action Proof → Decision Audit</text>
    </g>
  </g>

  <g>
    <rect x="1484" y="358" width="240" height="294" rx="16" fill="url(#greenCard)" stroke="#2ca98a"/>
    <text x="1504" y="387" class="node-title">Session Context</text>
    <text x="1504" y="420" class="mono">actor</text>
    <text x="1504" y="446" class="mono">membership</text>
    <text x="1504" y="472" class="mono">scope + scopes[]</text>
    <text x="1504" y="498" class="mono">mall_id</text>
    <text x="1504" y="524" class="mono">accessVersion</text>
    <text x="1504" y="550" class="mono">permissions</text>
    <text x="1504" y="576" class="mono">capabilities</text>
    <text x="1504" y="602" class="mono">assurance</text>
    <text x="1504" y="628" class="mono">governance</text>
  </g>
  <path d="M1466 505 L1484 505" stroke="#45dfb1" stroke-width="2.4" marker-end="url(#arrowGreen)"/>

  <path d="M1385 652 L1385 675" stroke="#55b8ff" stroke-width="2.4" marker-end="url(#arrowBlue)"/>
  <g>
    <rect x="1046" y="679" width="678" height="97" rx="16" fill="#142538" stroke="#334f6b"/>
    <text x="1068" y="706" class="node-title">同一套业务模块，只消费权威 Mall Context</text>
    <g class="chip-text">
      <rect x="1068" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1087" y="743">商品</text>
      <rect x="1155" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1174" y="743">订单</text>
      <rect x="1242" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1261" y="743">会员</text>
      <rect x="1329" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1348" y="743">财务</text>
      <rect x="1416" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1435" y="743">卡券</text>
      <rect x="1503" y="724" width="78" height="28" rx="14" fill="#234766"/><text x="1522" y="743">支付</text>
      <rect x="1590" y="724" width="112" height="28" rx="14" fill="#234766"/><text x="1613" y="743">统计 / 分销</text>
    </g>
  </g>

  <path d="M964 642 C1000 642 1002 293 1046 293" fill="none" stroke="#45dfb1" stroke-width="2.6" marker-end="url(#arrowGreen)"/>
  <text x="985" y="470" class="arrow-label" transform="rotate(-90 985 470)">Cookie + Session</text>

  <!-- Bottom data model -->
  <g filter="url(#shadow)">
    <rect x="50" y="830" width="1700" height="276" rx="24" fill="#0b1c30" stroke="#243e59"/>
  </g>
  <circle cx="82" cy="868" r="15" fill="#f5b94c"/><text x="78" y="873" class="number">4</text>
  <text x="108" y="875" class="panel-title">核心数据模型 · 一个账号，多份身份，每个会话固定一份身份</text>
  <text x="108" y="899" class="section-note">Domain Binding 选择入口；Access Membership 才是授权主体</text>

  <g>
    <rect x="78" y="932" width="180" height="96" rx="16" fill="#173753" stroke="#4fa9e9"/>
    <text x="98" y="961" class="node-title">Principal</text>
    <text x="98" y="985" class="body">全局账号 / 状态</text>
    <text x="98" y="1007" class="mono">credential_version</text>

    <rect x="304" y="918" width="198" height="58" rx="14" fill="#27314e" stroke="#5e6c96"/>
    <text x="324" y="944" class="node-title">Credential</text>
    <text x="324" y="965" class="tiny">密码 hash / 手机 OTP</text>
    <rect x="304" y="990" width="198" height="58" rx="14" fill="#27314e" stroke="#5e6c96"/>
    <text x="324" y="1016" class="node-title">Federated Identity</text>
    <text x="324" y="1037" class="tiny">微信 OpenID / UnionID</text>

    <rect x="550" y="932" width="188" height="96" rx="16" fill="#173d3a" stroke="#2ca98a"/>
    <text x="570" y="961" class="node-title">Member Profile</text>
    <text x="570" y="985" class="body">姓名 / 手机 / 业务档案</text>
    <text x="570" y="1007" class="tiny">不等同于权限身份</text>

    <rect x="786" y="918" width="224" height="122" rx="16" fill="#3a2f62" stroke="#7864b7"/>
    <text x="806" y="947" class="node-title">Access Membership</text>
    <text x="806" y="972" class="body">L0 Owner / L1 Owner / Shopper</text>
    <text x="806" y="995" class="mono">organization + client</text>
    <text x="806" y="1018" class="mono">status + access_version</text>

    <rect x="1058" y="918" width="196" height="58" rx="14" fill="#233a54" stroke="#4d7ba4"/>
    <text x="1078" y="944" class="node-title">Role Permission</text>
    <text x="1078" y="965" class="tiny">允许 / 显式拒绝</text>
    <rect x="1058" y="990" width="196" height="58" rx="14" fill="#233a54" stroke="#4d7ba4"/>
    <text x="1078" y="1016" class="node-title">Scope Grant</text>
    <text x="1078" y="1037" class="tiny">Platform / Mall / Self</text>

    <rect x="1302" y="932" width="188" height="96" rx="16" fill="#173d3a" stroke="#2ca98a"/>
    <text x="1322" y="961" class="node-title">Identity Session</text>
    <text x="1322" y="985" class="body">绑定一份 Membership</text>
    <text x="1322" y="1007" class="tiny">可撤销 / 版本感知</text>

    <rect x="1538" y="918" width="184" height="58" rx="14" fill="#3a2f62" stroke="#7864b7"/>
    <text x="1558" y="944" class="node-title">Auth Ticket</text>
    <text x="1558" y="965" class="tiny">一次性跨页面交接</text>
    <rect x="1538" y="990" width="184" height="58" rx="14" fill="#3a2f62" stroke="#7864b7"/>
    <text x="1558" y="1016" class="node-title">Assurance</text>
    <text x="1558" y="1037" class="tiny">AAL / 当前会话 Step-up</text>
  </g>

  <g fill="none" stroke-width="2.2">
    <path d="M258 962 L304 947" stroke="#55b8ff" marker-end="url(#arrowBlue)"/>
    <path d="M258 996 L304 1019" stroke="#55b8ff" marker-end="url(#arrowBlue)"/>
    <path d="M258 980 L550 980" stroke="#55b8ff" marker-end="url(#arrowBlue)"/>
    <path d="M738 980 L786 980" stroke="#45dfb1" marker-end="url(#arrowGreen)"/>
    <path d="M1010 956 L1058 947" stroke="#55b8ff" marker-end="url(#arrowBlue)"/>
    <path d="M1010 1005 L1058 1019" stroke="#55b8ff" marker-end="url(#arrowBlue)"/>
    <path d="M1254 980 L1302 980" stroke="#45dfb1" marker-end="url(#arrowGreen)"/>
    <path d="M1490 962 L1538 947" stroke="#45dfb1" marker-end="url(#arrowGreen)"/>
    <path d="M1490 998 L1538 1019" stroke="#45dfb1" marker-end="url(#arrowGreen)"/>
  </g>

  <rect x="78" y="1060" width="1644" height="28" rx="14" fill="#10263a"/>
  <text x="100" y="1079" class="tiny">示例：同一 Ethan Principal → L0 主打团 Owner（Platform Scope）／L1 宏泰 Owner（Mall Scope）／宏泰消费者（Mall + Self Scope）</text>

  <!-- Current debt / target strip -->
  <g>
    <rect x="50" y="1132" width="1700" height="76" rx="20" fill="#211b18" stroke="#7a5827"/>
