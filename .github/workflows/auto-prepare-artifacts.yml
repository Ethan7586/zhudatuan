name: Automatic Artifact Closure 1.4.3
run-name: Seal affected artifacts 1.4.3 for ${{ inputs.head_sha || github.sha }}

# This post-merge workflow never deploys. It prepares affected immutable artifacts and seals
# candidates after zdt-next has already accepted the source commit.
on:
  push:
    branches:
      - zdt-next
  workflow_dispatch:
    inputs:
      head_sha:
        description: Historical zdt-next lineage merge to re-evaluate with the latest control plane
        required: true
        type: string
      base_sha:
        description: Optional ancestor SHA used to recover a prior failed automatic closure
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  plan:
    name: Identify affected runtime targets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
      source_sha: ${{ steps.matrix.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Load planner dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build automatic preparation matrix
        id: matrix
        env:
          BEFORE_SHA: ${{ inputs.base_sha || github.event.before }}
          SOURCE_SHA: ${{ inputs.head_sha || github.sha }}
          CONTROL_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import { loadAdapter } from './04_tools/release-engine/src/adapter.mjs';
          import { automaticClosureManifest, automaticClosureSelection } from './04_tools/release-engine/src/automatic-preparation.mjs';
          import { createPlan } from './04_tools/release-engine/src/planner.mjs';
          import { assertGitAncestor, commitMetadata } from './04_tools/release-engine/src/git.mjs';

          const adapter = await loadAdapter('02_platform_pingtai/infrastructure/release/zdt-next.release.json');
          const commit = await commitMetadata(adapter.projectRoot, process.env.SOURCE_SHA);
          const eventBefore = process.env.BEFORE_SHA ?? '';
          const before = eventBefore !== '' && !/^[0]+$/.test(eventBefore) ? eventBefore : commit.parents[0];
          if (!before) throw new Error('Automatic closure source has no first parent');
          await assertGitAncestor(adapter.projectRoot, before, process.env.SOURCE_SHA);
          await assertGitAncestor(adapter.projectRoot, process.env.SOURCE_SHA, process.env.CONTROL_SHA);
          const plan = await createPlan(adapter, { from: before, to: process.env.SOURCE_SHA });
          const selection = automaticClosureSelection(adapter, {
            plannedTargets: plan.deploymentOrder,
            changeCount: plan.changes.length,
            beforeSha: plan.from.sha,
            commit,
          });
          const closure = automaticClosureManifest(adapter, {
            sourceSha: plan.to.sha,
            beforeSha: plan.from.sha,
            targets: selection.targets,
            sealNodesByTarget: selection.sealNodesByTarget,
            reconciliation: selection.reconciliation,
          });
          const entries = closure.preparations;
          mkdirSync('.automatic-artifact-closure', { recursive: true });
          writeFileSync('.automatic-artifact-closure/closure.json', `${JSON.stringify(closure, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include: entries })}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `has_targets=${entries.length > 0}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `source_sha=${closure.sourceSha}\n`);
          console.log(entries.length === 0 ? 'No runtime artifact was affected.' : `Affected targets: ${entries.map(({ target }) => target).join(', ')}`);
          NODE
      - name: Preserve closure plan
        uses: actions/upload-artifact@v6
        with:
          name: automatic-artifact-plan-${{ steps.matrix.outputs.source_sha }}
          path: .automatic-artifact-closure/closure.json
          if-no-files-found: error
          retention-days: 90

  close:
    name: Prepare and seal ${{ matrix.target }}
    needs: plan
    if: needs.plan.outputs.has_targets == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    uses: ./.github/workflows/auto-prepare-one-target.yml
    with:
      head_sha: ${{ needs.plan.outputs.source_sha }}
      release_target: ${{ matrix.target }}
      prepare_node: ${{ matrix.prepare_node }}
      seal_nodes_json: ${{ matrix.seal_nodes_json }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}

  finalize:
    name: Finalize exact sealed closure
    needs: [plan, close]
    if: ${{ always() && needs.plan.result == 'success' && (needs.close.result == 'success' || needs.close.result == 'skipped') }}
    runs-on: [self-hosted, linux, x64, zdt-aliyun-release]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
      - name: Load finalizer dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Download closure plan
        uses: actions/download-artifact@v7
        with:
          name: automatic-artifact-plan-${{ needs.plan.outputs.source_sha }}
          path: .automatic-artifact-closure
      - name: Require every exact final Seal and finalize one authority
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CONTROL_SHA: ${{ github.sha }}
          AI_DELIVERY_AUTH_MODE: static-access-key
          AI_DELIVERY_ROLE_KIND: releaser
          AI_DELIVERY_ALLOW_STATIC_ACCESS_KEY: true
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { loadAdapter } from './04_tools/release-engine/src/adapter.mjs';
          import { finalizeProductionClosureManifest, verifyProductionClosureManifest } from './04_tools/release-engine/src/production-orchestrator.mjs';

          const adapter = await loadAdapter('02_platform_pingtai/infrastructure/release/zdt-next.release.json');
          const path = '.automatic-artifact-closure/closure.json';
          const draft = JSON.parse(readFileSync(path, 'utf8'));
          const closure = await finalizeProductionClosureManifest(adapter, draft, {
            controlPlaneSha: process.env.CONTROL_SHA,
            releaseRunner: process.env.RUNNER_NAME ?? 'automatic-closure-finalizer',
          });
          verifyProductionClosureManifest(closure, process.env.SOURCE_SHA);
          writeFileSync(path, `${JSON.stringify(closure, null, 2)}\n`);
          NODE
      - name: Publish finalized sealed closure
        uses: actions/upload-artifact@v6
        with:
          name: automatic-artifact-closure-${{ needs.plan.outputs.source_sha }}
          path: .automatic-artifact-closure/closure.json
          if-no-files-found: error
          retention-days: 90
