version: 1
owner: reliability
buffer:
  capacity: 20000
  retentionSeconds: 3600
  maximumRead: 5000
health:
  freshnessSeconds: 300
  queueBacklogDepth: 1000
  checks: [dependency, queue, provider, servicelevel, release]
slo:
  catalogP95Ms: 150
  queryP95Ms: 300
  facetP95Ms: 600
  detailP95Ms: 500
  writeP95Ms: 500
  jobReceiptP95Ms: 2000
  checkoutQuoteP95Ms: 800
  checkoutConfirmP95Ms: 1000
  applicationListP95Ms: 250
  entryCacheHitP95Ms: 20
  entryDatabaseP95Ms: 80
  bootstrapP95Ms: 300
  qrEncodeP95Ms: 30
  qrBundleGzipKb: 100
  commandP95Ms: 800
  employeeInvitationCreateP95Ms: 300
  invitationResolveP95Ms: 300
  enrollmentCompleteP95Ms: 800
  supportMessageSendP95Ms: 300
  supportConversationP95Ms: 500
  supportQueueP95Ms: 500
  supportEventDeliveryP95Ms: 1000
  orderP95Ms: 1500
  webhookDurableAcceptP99Ms: 500
  outboxP99Seconds: 30
  availabilityPercent: 99.95
  rpoMinutes: 0
  rtoMinutes: 15
serviceLevels:
  operationavailability:
    title: 核心操作可用率
    indicator: {metric: commerce.operation.count, type: ratio, goodResult: success}
    targetKey: availabilityPercent
    unit: percent
    direction: minimum
    windowSeconds: 300
    severity: critical
    owner: reliability
    runbook: docs/operations/deployment.md
  operationlatency:
    title: 核心操作 P95 延迟
    indicator: {metric: commerce.operation.duration, type: percentile, percentile: 95}
    targetKey: commandP95Ms
    unit: milliseconds
    direction: maximum
    windowSeconds: 300
    severity: warning
    owner: reliability
    runbook: docs/operations/deployment.md
  outboxlatency:
    title: Outbox P99 延迟
    indicator: {metric: commerce.outbox.lag, type: percentile, percentile: 99}
    targetKey: outboxP99Seconds
    unit: seconds
    direction: maximum
    windowSeconds: 300
    severity: critical
    owner: runtime
    runbook: docs/operations/outbox.md
browser:
  webVitals: [lcp, inp, cls, fcp, ttfb]
  budgets:
    lcpP75Ms: 2500
    inpP75Ms: 200
    clsMaximum: 0.1
  navigation: [routeid, durationms, outcome]
  query: [resource, durationms, cache, outcome, aborted]
  mutation: [operation, durationms, outcome, conflict, stepup]
  stream: [channel, reconnects, cursorage, outcome]
  payment: [intent, confirmationms, outcome]
  upload: [kind, bytes, durationms, checksum, outcome]
  forbiddenFields: [query, payload, secret, token, password, otp, proof, pii]
metrics:
  operation: [module, operation, result, errorcode, durationms]
  job: [module, job, queue, result, errorcode, durationms]
  provider: [provider, capability, operation, result, errorcode, durationms]
  resource: [workload, resource, utilization, saturation, errors]
  approval: [template, state, decision, durationms, outcome]
  voucherbatch: [kind, state, total, succeeded, failed, durationms]
  importing: [kind, phase, total, accepted, rejected, duplicate, durationms]
  reconciliation: [provider, state, matched, differences, durationms]
  providercapability: [provider, capability, operation, outcome, durationms]
  webvitals: [surface, routeid, metric, value, rating, navigationtype]
sampling:
  errors: 1
  critical: 1
  highrisk: 1
  slow: 1
  commands: 1
  reads: 0.1
  webvitals: 1
  providerhealth: 0.1
retention:
  metricsDays: 30
  successfulTraceDays: 7
  errorTraceDays: 30
  highRiskTraceDays: 180
  operationalLogDays: 30
  securityLogDays: 365
export:
  redactionOrder: before-buffer-and-export
  onRedactionFailure: drop-and-alert
  piiAllowed: false
  metricUnknownLabel: reject-and-alert
  traceIdentifiersAs: exemplar
alerts:
  entryfailure: {title: 商城入口失败率过高, signal: experience.entry.resolve.failure, measure: percent, windowSeconds: 300, threshold: 1, severity: critical, owner: experience, runbook: docs/operations/mallentry.md, dashboard: salechain, recentChanges: release, traceQuery: entryfailure, mitigation: keepoldhead}
  entryinvalid: {title: 商城入口配置无效, signal: experience.entry.invalid, measure: count, windowSeconds: 60, threshold: 0, severity: critical, owner: experience, runbook: docs/operations/mallentry.md, dashboard: salechain, recentChanges: release, traceQuery: entryinvalid, mitigation: blockheadswitch}
  sessionmallmismatch: {title: 会话商城范围不匹配, signal: identity.session.mallmismatch, measure: count, windowSeconds: 300, threshold: 20, severity: warning, owner: identity, runbook: docs/operations/sessioncompromise.md, dashboard: identity, recentChanges: identity, traceQuery: scopeddenial, mitigation: revokesession}
  approvaloverdue: {title: 审批任务超时, signal: approval.task.overdue, measure: count, windowSeconds: 300, threshold: 0, severity: warning, owner: approval, runbook: docs/operations/approval.md, dashboard: identity, recentChanges: approval, traceQuery: approvaloverdue, mitigation: escalatealternate}
  voucherbatchfailure: {title: 卡券批次失败率过高, signal: business.voucher.issuecompletion, measure: inversepercent, windowSeconds: 300, threshold: 1, severity: critical, owner: voucher, runbook: docs/operations/voucherissue.md, dashboard: voucher, recentChanges: voucher, traceQuery: voucherbatch, mitigation: pausebatch}
  importfailure: {title: 导入失败或积压过高, signal: business.import.error, measure: percent, windowSeconds: 300, threshold: 1, severity: warning, owner: runtime, runbook: docs/operations/catalogimport.md, dashboard: runtime, recentChanges: import, traceQuery: importfailure, mitigation: limitlowpriorityimports}
  reconciliationdifference: {title: 对账差异未清零, signal: business.finance.reconciliationdifference, measure: count, windowSeconds: 900, threshold: 0, severity: critical, owner: finance, runbook: docs/operations/reconciliation.md, dashboard: finance, recentChanges: finance, traceQuery: reconciliationdifference, mitigation: blocksettlementperiod}
  providercapabilityfailure: {title: Provider 能力失败率过高, signal: commerce.provider.count, measure: failurepercent, windowSeconds: 300, threshold: 5, severity: warning, owner: extension, runbook: docs/operations/providerhealth.md, dashboard: provider, recentChanges: extension, traceQuery: providerfailure, mitigation: isolateconnection}
  servicelevelburn: {title: 核心操作错误预算消耗过快, signal: slo.operationavailability, measure: burnrate, windowSeconds: 300, threshold: 2, severity: critical, owner: reliability, runbook: docs/operations/deployment.md, dashboard: runtime, recentChanges: release, traceQuery: operationfailure, mitigation: stoprollout}
  paymentunknown: {title: 支付未知结果超过恢复时限, signal: business.payment.unknown, measure: percent, windowSeconds: 300, threshold: 0.1, severity: critical, owner: payment, runbook: docs/operations/paymentquery.md, dashboard: transaction, recentChanges: payment, traceQuery: paymentunknown, mitigation: querywithoutrecharge}
  inventoryconflict: {title: 库存冲突或超卖, signal: business.inventory.conflict, measure: percent, windowSeconds: 300, threshold: 1, severity: critical, owner: inventory, runbook: docs/operations/inventoryimport.md, dashboard: salechain, recentChanges: inventory, traceQuery: inventoryconflict, mitigation: freezelistingwrites}
  ledgerimbalance: {title: 账本借贷不平, signal: business.finance.ledgerimbalance, measure: count, windowSeconds: 60, threshold: 0, severity: critical, owner: finance, runbook: docs/operations/reconciliation.md, dashboard: finance, recentChanges: finance, traceQuery: ledgerimbalance, mitigation: blockfinancewrites}
  outboxbacklog: {title: Outbox 或 Deadletter 积压, signal: commerce.outbox.lag, measure: seconds, windowSeconds: 300, threshold: 30, severity: critical, owner: runtime, runbook: docs/operations/outbox.md, dashboard: runtime, recentChanges: runtime, traceQuery: outboxbacklog, mitigation: pauseaffectedpartition}
  releasefailure: {title: 发布门禁失败, signal: release.gate.failure, measure: count, windowSeconds: 60, threshold: 0, severity: critical, owner: reliability, runbook: docs/operations/deployment.md, dashboard: runtime, recentChanges: release, traceQuery: releasefailure, mitigation: stoporrollbackbeforeretire}
  securityincident: {title: 安全不变量异常, signal: security.invariant.failure, measure: count, windowSeconds: 60, threshold: 0, severity: critical, owner: security, runbook: docs/operations/securityincident.md, dashboard: identity, recentChanges: security, traceQuery: securityincident, mitigation: revokeandpreserveevidence}
redaction:
  deny:
    - authorization
    - address
    - apikey
    - attachment
    - body
    - callback
    - cardcode
    - cardsecret
    - challenge
    - ciphertext
    - claim
    - code
    - cookie
    - credential
    - csrf
    - destination
    - email
    - evidence
    - filename
    - invite
    - message
    - mobile
    - nonce
    - objectref
    - otp
    - password
    - phone
    - preauth
    - privatekey
    - proof
    - recipient
    - secret
    - token
    - tokenhash
