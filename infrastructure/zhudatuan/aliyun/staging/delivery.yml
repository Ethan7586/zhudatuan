version: 1
owner: zhudatuan
environment: staging
sourceOfTruth: config/owner-approved-ui.json
scope: identity-registration-and-sms-only
isolation:
  releaseBase: /opt/zhudatuan-staging/releases
  releaseRoot: /opt/zhudatuan-staging/current
  sharedRoot: /opt/zhudatuan-staging/shared
  logRoot: /var/log/zhudatuan-staging
  productionTrafficPercent: 0
  productionDataAccess: forbidden
runtime:
  processConfig: infrastructure/zhudatuan/aliyun/staging/ecosystem.config.cjs
  proxyConfig: infrastructure/zhudatuan/aliyun/staging/Caddyfile
  identityApiEnvironmentFile: /opt/zhudatuan-staging/shared/identity-registration-api.env
  identityJobsEnvironmentFile: /opt/zhudatuan-staging/shared/identity-notification-jobs.env
  identityApiPort: 4421
routes:
  accounts:
    hostEnv: ZHUDATUAN_STAGING_ACCOUNTS_HOST
    workspace: apps/auth-web
    artifact: apps/auth-web/dist
    server: caddy-static
    buildEnvironment:
      apiOriginHostEnv: ZHUDATUAN_STAGING_API_HOST
      adminOriginHostEnv: ZHUDATUAN_STAGING_CONSOLE_HOST
  console:
    hostEnv: ZHUDATUAN_STAGING_CONSOLE_HOST
    workspace: apps/console
    artifact: apps/console/dist
    server: caddy-static
    buildEnvironment:
      apiOriginHostEnv: ZHUDATUAN_STAGING_API_HOST
      authOriginHostEnv: ZHUDATUAN_STAGING_ACCOUNTS_HOST
  identityApi:
    hostEnv: ZHUDATUAN_STAGING_API_HOST
    workspace: services/commerce
    artifact: services/commerce/dist/IdentityRegistrationApiMain.js
    readinessArtifact: services/commerce/dist/IdentityRegistrationApiReadyMain.js
    process: zhudatuan-staging-identity-api
    profile: registration-only
    port: 4421
    allowedMethods: [GET, POST, DELETE, OPTIONS]
    allowedPathPrefix: /api/v1/identity/
workers:
  identityNotification:
    workspace: services/commerce
    artifact: services/commerce/dist/IdentityNotificationJobsOnlyMain.js
    readinessArtifact: services/commerce/dist/IdentityNotificationJobsReadyMain.js
    process: zhudatuan-staging-identity-notification-jobs
    profile: identity-notification-only
  fullJobsMain: forbidden
dependencies:
  database:
    apiConnectionRefEnv: DATABASE_API_CONNECTION_REF
    jobsConnectionRefEnv: DATABASE_JOB_CONNECTION_REF
    isolatedRoles: [zhudatuanidentityapi, zhudatuanidentityjob]
  secretStore:
    endpointEnv: SECRET_STORE_ENDPOINT
    separateBearerPerWorkload: true
  kms:
    endpointEnv: KMS_ENDPOINT
    separateBearerPerWorkload: true
  aliyunSms:
    configurationRefEnv: IDENTITY_NOTIFICATION_CONFIG_REF
    credentialMode: ram-role
  redis: unused
guards:
  edgeAccessRequired: true
  robotsIndexing: disabled
  migrationsMustTargetIsolatedDatabase: true
  secretValuesInRepository: forbidden
  unrelatedCommerceDependencies: forbidden
