version: 1
owner: reliability
source: config/telemetry.yml
probes: [live, ready, startup, dependency]
dashboards: [runtime, database, queue, provider, security, storefrontentry]
metrics:
  - experience.entry.resolve.duration
  - experience.entry.resolve.failure
  - experience.entry.state
  - experience.publication.activate.duration
  - storefront.bootstrap.duration
  - storefront.bootstrap.failure
  - console.entry.dialog.open
  - console.entry.copy.failure
  - console.entry.download.failure
alerts:
  - readiness
  - errorbudget
  - outboxlag
  - providerbreaker
  - databasefencing
  - backuprestore
  - invitationbruteforce
  - invitationreplay
  - consoleprooffailure
  - invitationstale
  - invitationclaimbacklog
  - invitationcleanuplag
  - authorizationsnapshotlatency
  - invitationkeyunavailable
  - invitationreceiptconsistency
  - invitationsessionconsistency
  - navigationauthorizationdrift
  - cacheunavailable
  - jobqueuebacklog
  - workloadavailability
  - zonecapacity
  - postgresfailover
  - storefrontentryfailure
  - storefrontentryinvalid
  - storefrontentrycache
  - publicationentryconsistency
  - storefrontoriginmismatch
  - mallqrsmoke
  - storefrontsessionmismatch
