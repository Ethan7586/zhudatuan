version: 1
profile: Smart Wing OMS 2.0 / WCHS-MCBS Order Profile 1.0
authority: orderRequirements
chain:
  - WorkbookCell
  - Requirement
  - UIRoute
  - Operation
  - Owner
  - Handler
  - RepositoryOrProjection
  - Test
  - Runbook
  - ReleaseEvidence
  - WorkPackage
productBaseline:
  platformOrderCapability: 平台继承全域订单能力
  procurementMarker: 已采购是人工运营标识，与 Provider Purchase 独立
  orderType: 商品、话费、虚拟券、自有实物与 Provider 等稳定枚举
  exceptionReasons: payment、provider、fulfillment、aftersale、reconciliation
  tagScope: 标签在机构范围创建，后代继承必须显式
  noteVisibility: 运营备注仅内部可见，会员回复归 Support
  exportTemplate: 模板按版本冻结列、数据范围与最大行数
  mergedOrder: 仅同收货人、同商城、同支付主体、确定性 Provider 与运费规则可合并
requirements:
  - id: OMS-001
    version: 1
    title: 订单状态分组
    description: 将支付、履约、售后等独立状态投影成待支付、待发货、已发货、已完成、已取消或关闭等稳定工作台分组。
    wave: 1
    priority: P0
    workbookEvidence:
      - sheet: 20250416需求汇总
        range: A8:C8
      - sheet: 20260430需求汇总
        range: H111:K112
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall]
      rule: 平台看全域，机构与子机构看后代商城，商城仅看本商城。
    owner: order
    collaboratingModules: [payment, fulfillment, reporting]
    uiRoute: /orders
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: [order.orders.read]
    plannedOperations: []
    operationCoverage: 当前读 Operation 只提供分页与精确订单 ID，状态分组和多维状态过滤仍由后续工作包补齐。
    dataObjectsAndProjections:
      - status: Existing
        target: ordering.orderrecord
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
      - status: Designed
        target: reporting.orderworkspaceprojection.statusgroups
        evidence: []
    successDefinition:
      - 每个工作台分组由服务端确定性过滤，不由前端样例计数推导。
      - Lifecycle、Payment、Fulfillment、Aftersale 维度保持独立且分组口径有版本。
    exceptionsAndRejections:
      - 未识别状态进入可解释的未归类结果，不伪装成已完成。
      - 状态过滤与当前组织范围不一致时拒绝返回越界记录。
    performanceTarget: 50 行 Keyset 列表 P95 不超过 300ms，最大页 200 行。
    securityPolicyStatement: 沿用现有 order.read、组织 closure 与 RLS；A01 不新增或收窄权限。
    futureWorkPackages: [E01, E02, E03]
    testPlans:
      Unit: 验证独立状态维度到工作台分组的穷举映射。
      Contract: 验证分组枚举、过滤参数与响应计数契约。
      Integration: 验证组织范围、Keyset 与组合状态 SQL。
      Journey: 验证运营人员切换全部状态分组并打开订单。
      Browser: 验证桌面与窄屏分组、Loading、Empty、Error 和 Stale 状态。
      Performance: 验证 50/200 行分页的 P95、查询次数与返回字节。
      Recovery: 验证投影落后或未知状态时可重建并保留 Watermark。
    runbookSlug: order-status-groups
    releaseEvidenceSlug: order-status-groups
    lifecycleStatus: Designed

  - id: OMS-002
    version: 1
    title: 订单详情
    description: 展示订单编号、金额、收货人、商品行、供应商、用户、组织、支付、履约、售后、发票与核销的稳定详情摘要。
    wave: 1
    priority: P0
    workbookEvidence:
      - sheet: 20250416需求汇总
        range: C8
      - sheet: 20260430需求汇总
        range: E111
      - sheet: 20260430需求汇总
        range: K112
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator, supplieroperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall, supplier, owner]
      rule: 详情可见范围必须与列表相同，供应商只见其履约相关订单。
    owner: order
    collaboratingModules: [payment, fulfillment, finance, channel]
    uiRoute: /orders/:orderId
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: []
    plannedOperations: [order.orders.detail.read]
    operationCoverage: 现有列表通过 order 查询参数模拟详情，缺少稳定详情 Operation 与跨域摘要契约。
    dataObjectsAndProjections:
      - status: Existing
        target: ordering.orderrecord-and-line
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
      - status: Designed
        target: reporting.orderdetailprojection
        evidence: []
    successDefinition:
      - 一个详情响应返回订单强事实和有来源版本的跨域摘要。
      - 从列表打开详情后不丢失筛选、游标和组织上下文。
    exceptionsAndRejections:
      - 不存在或不在可见范围的订单统一返回资源不可见结果。
      - 跨域摘要暂不可用时标明 Partial Failure，不伪造终态。
    performanceTarget: 订单详情 P95 不超过 500ms，禁止 N+1 查询。
    securityPolicyStatement: 复用列表的现有组织范围与字段处理；A01 不新增详情权限。
    futureWorkPackages: [C01, C02, E01, E02, E03]
    testPlans:
      Unit: 验证详情摘要字段和跨域状态组合。
      Contract: 验证详情路径、字段、版本与 Partial Failure 结构。
      Integration: 验证订单行与跨域投影一次有界读取。
      Journey: 验证从列表进入详情并查看支付、履约、售后页签。
      Browser: 验证 Drawer 与独立详情页在四种宽度下可用。
      Performance: 验证详情 P95、查询数、计划成本与响应体大小。
      Recovery: 验证某个摘要投影不可用时其余强事实仍可读取。
    runbookSlug: order-detail-read
    releaseEvidenceSlug: order-detail-read
    lifecycleStatus: Designed

  - id: OMS-003
    version: 1
    title: 标签与备注
    description: 支持机构范围标签、订单标签分配和仅运营可见的追加备注，并记录操作者、时间与变更历史。
    wave: 1
    priority: P1
    workbookEvidence:
      - sheet: 20250416需求汇总
        range: C8
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall]
      rule: 标签归属机构，后代商城是否继承由已采纳的产品基线显式配置。
    owner: order
    collaboratingModules: [organization, audit, support]
    uiRoute: /orders/:orderId?tab=operations
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: []
    plannedOperations: [order.orders.annotations.create]
    operationCoverage: 当前订单没有标签或备注写 Operation，客服外部回复继续由 Support 承载。
    dataObjectsAndProjections:
      - status: Designed
        target: ordering.orderannotation
        evidence: []
      - status: Designed
        target: ordering.ordertag-and-assignment
        evidence: []
    successDefinition:
      - 可追加内部备注、分配或移除标签，并按标签检索订单。
      - 每次变更保留组织范围、操作者、时间和不可混淆的可见性。
    exceptionsAndRejections:
      - 跨机构标签分配被拒绝且不产生部分写入。
      - 会员可见内容被引导到 Support 消息，不写入运营备注。
    performanceTarget: 普通标注命令 P95 不超过 800ms，列表标签过滤满足 300ms 目标。
    securityPolicyStatement: 仅声明沿用现有组织范围；标签继承和备注可见性不在 A01 实施。
    futureWorkPackages: [F01]
    testPlans:
      Unit: 验证标签归属、继承决策和备注可见性规则。
      Contract: 验证追加式标注命令与冲突响应。
      Integration: 验证标签分配、历史记录和筛选投影原子一致。
      Journey: 验证打标、备注、筛选和操作历史闭环。
      Browser: 验证标签选择器、备注编辑与禁用原因可访问。
      Performance: 验证批量标签读取无 N+1 且过滤命中索引。
      Recovery: 验证投影重建后标签和备注历史不丢失。
    runbookSlug: order-annotations
    releaseEvidenceSlug: order-annotations
    lifecycleStatus: Designed

  - id: OMS-004
    version: 1
    title: 层级可见性
    description: 平台、机构、子机构、商城、供应商和会员按组织树与业务归属读取订单，平台继承全域订单能力。
    wave: 1
    priority: P0
    workbookEvidence:
      - sheet: 20250416需求汇总
        range: D8:G9
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator, supplieroperator, member]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall, supplier, owner]
      rule: 组织后代通过权威 closure 计算，供应商和会员按订单业务归属读取。
    owner: order
    collaboratingModules: [organization, fulfillment]
    uiRoute: /orders
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: [organization.layers.read, order.orders.read]
    plannedOperations: []
    operationCoverage: 现有订单 SQL 已使用组织 closure 及供应商、门店、会员分支，但全筛选矩阵仍待集成验证。
    dataObjectsAndProjections:
      - status: Existing
        target: organization.unitclosure
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
      - status: Existing
        target: ordering.orderrecord.scope
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
    successDefinition:
      - 同一订单在各角色下的可见结果与组织树和业务归属一致。
      - 平台、机构、子机构与商城计数由同一服务端范围口径计算。
    exceptionsAndRejections:
      - 浏览器提交的任意 scope 不替代服务端已解析范围。
      - 组织移动期间使用明确版本，避免一次请求混用新旧层级。
    performanceTarget: 范围过滤包含在 50 行列表 P95 300ms 内。
    securityPolicyStatement: 只记录现有 closure、scope 与 RLS 事实；A01 不新增任何权限守卫。
    futureWorkPackages: [E01, E02]
    testPlans:
      Unit: 验证角色与范围种类的可见性矩阵。
      Contract: 验证范围上下文不由查询参数声明。
      Integration: 验证组织后代、供应商、门店与会员查询分支。
      Journey: 验证不同层级登录后看到对应订单集合。
      Browser: 验证当前组织范围在工作台中清晰展示。
      Performance: 验证 closure 查询计划与大组织树分页性能。
      Recovery: 验证组织树版本变化时重试不泄漏跨范围数据。
    runbookSlug: order-scope-visibility
    releaseEvidenceSlug: order-scope-visibility
    lifecycleStatus: Designed

  - id: OMS-005
    version: 1
    title: 多维检索
    description: 支持时间、订单号、人员、收货人、商品、供应商、类型、状态、商城、核销和开票等条件的服务端组合检索。
    wave: 1
    priority: P0
    workbookEvidence:
      - sheet: 20260430需求汇总
        range: E111
      - sheet: 20260430需求汇总
        range: K112
      - sheet: 20260430需求汇总
        range: K115
      - sheet: 20260430需求汇总
        range: K117
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall]
      rule: 所有检索条件先与服务端组织范围相交，再执行有界 Keyset 查询。
    owner: order
    collaboratingModules: [reporting, organization, fulfillment, finance]
    uiRoute: /orders
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: [order.orders.read]
    plannedOperations: []
    operationCoverage: 当前 Operation 仅支持 order 精确 ID 和游标，工作簿要求的组合条件尚未成为服务端契约。
    dataObjectsAndProjections:
      - status: Designed
        target: reporting.orderworkspaceprojection.searchfields
        evidence: []
      - status: Existing
        target: ordering.orderrecord
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
    successDefinition:
      - 工作簿列出的条件可组合、可分页、可复现为 Filter Snapshot。
      - 姓名和手机号检索复用项目既有搜索标识，不建立第二套 PII 规则。
    exceptionsAndRejections:
      - 无效枚举、时间范围或游标以稳定错误拒绝。
      - 过滤条件超出模板或范围时不静默忽略。
    performanceTarget: 默认 50、最大 200 行 Keyset，订单列表 P95 不超过 300ms。
    securityPolicyStatement: 复用既有字段处理和组织范围；A01 只冻结检索需求，不改变权限。
    futureWorkPackages: [E01, E02, E03]
    testPlans:
      Unit: 验证过滤规范化、稳定枚举和 Filter Snapshot。
      Contract: 验证全部查询参数、组合规则与错误代码。
      Integration: 验证组合索引、Keyset 和组织范围查询。
      Journey: 验证用户组合筛选、重置、刷新和返回详情。
      Browser: 验证高级筛选折叠、键盘顺序和窄屏布局。
      Performance: 验证代表性高选择性与低选择性组合的 P95。
      Recovery: 验证 Stale Watermark 下刷新仍保持原 Filter Snapshot。
    runbookSlug: order-search
    releaseEvidenceSlug: order-search
    lifecycleStatus: Designed

  - id: OMS-006
    version: 1
    title: 采购标识
    description: 单条或批量标记人工已采购并可筛选，人工标识与 Channel 权威的 Provider Purchase 状态始终分开。
    wave: 1
    priority: P1
    workbookEvidence:
      - sheet: 20260430需求汇总
        range: K111
      - sheet: 20260430需求汇总
        range: K114
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall]
      rule: 只能标记当前可见范围内的显式订单 ID 集。
    owner: order
    collaboratingModules: [channel, audit]
    uiRoute: /orders
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: []
    plannedOperations: [order.orders.procurementmarks.batch]
    operationCoverage: 当前没有采购标识 Operation，且不得复用 Provider Purchase 状态冒充人工动作。
    dataObjectsAndProjections:
      - status: Designed
        target: ordering.orderprocurementmarker
        evidence: []
      - status: Designed
        target: reporting.providerpurchaseprojection
        evidence: []
    successDefinition:
      - 单条和批量标记返回逐项成功、冲突或不可见结果。
      - 工作台同时显示人工标识与真实 Provider Purchase 状态且可分别筛选。
    exceptionsAndRejections:
      - 空 ID 集、重复 ID、不可见订单和版本冲突逐项报告。
      - 人工标记不会触发 Provider 网络调用或改变外部采购终态。
    performanceTarget: 普通命令 P95 不超过 800ms，批量命令异步分片且不占长事务。
    securityPolicyStatement: 复用现有订单范围与审计基础；A01 不创建标记权限或守卫。
    futureWorkPackages: [F02]
    testPlans:
      Unit: 验证人工标识与 Provider Purchase 状态完全独立。
      Contract: 验证显式 ID 集和逐项结果契约。
      Integration: 验证批量 CAS、审计记录与列表投影。
      Journey: 验证选择多单、标记、筛选与撤销产品决策。
      Browser: 验证批量选择、标识呈现和禁用原因。
      Performance: 验证大批次分片、锁范围和返回大小。
      Recovery: 验证部分成功后可用同一幂等键安全重试。
    runbookSlug: procurement-marker
    releaseEvidenceSlug: procurement-marker
    lifecycleStatus: Designed

  - id: OMS-007
    version: 1
    title: 多模板导出
    description: 按筛选快照异步生成订单总表、发货表、自定义发货表、礼包、积分商城和机构对账等版本化模板。
    wave: 1
    priority: P1
    workbookEvidence:
      - sheet: 20260430需求汇总
        range: E112
      - sheet: 20260430需求汇总
        range: K113
      - sheet: 20260430需求汇总
        range: K116
      - sheet: 20260430需求汇总
        range: K118
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator, financeoperator]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall]
      rule: 导出范围固定为创建请求时的服务端可见范围与 Filter Snapshot。
    owner: reporting
    collaboratingModules: [order, finance, fulfillment]
    uiRoute: /orders
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: [order.orders.export]
    plannedOperations: []
    operationCoverage: 当前 Operation 可创建 orders 导出任务，但模板版本、列清单、最大行数和恢复证据尚未冻结。
    dataObjectsAndProjections:
      - status: Existing
        target: reporting.exportjob
        evidence: [services/commerce/src/modules/reporting/domain/model/ExportJob.ts]
      - status: Designed
        target: reporting.exporttemplate-and-artifact
        evidence: []
    successDefinition:
      - 每个导出记录模板版本、列、范围、Filter Snapshot、Watermark、行数和对象 Hash。
      - 创建接口快速返回任务，生成过程可查询、重试和下载。
    exceptionsAndRejections:
      - 未知模板、超最大行数或失效范围以稳定结果结束任务。
      - 失败任务不暴露半成品对象且可从检查点恢复。
