version: 2
authority:
  owner: Ethan
  approvedAt: 2026-08-28T15:59:46+08:00
  source: evidence/visuals/baseline
  policy:
    preserveLayout: true
    preserveInteraction: true
    preserveNavigationTitles: true
    requireRealData: true
    requireTypedSdk: true
    forbidMockRoutes: true
    forbidShowcaseRoutes: true
    forbidDeviceShells: true
defaults:
  theme: light
  locale: zh-CN
  seed: visualv1
  data: deterministic
  motion: reduced
viewports:
  desktop1920:
    width: 1920
    height: 1080
  desktop1440:
    width: 1440
    height: 900
  desktop1366:
    width: 1366
    height: 768
  tabletlandscape:
    width: 1024
    height: 768
  tabletportrait:
    width: 768
    height: 1024
  mobile390:
    width: 390
    height: 844
  mobile375:
    width: 375
    height: 812
  mobile360:
    width: 360
    height: 800
states: &a1
  - loading
  - empty
  - error
  - denied
  - expired
  - partial
  - success
interactions:
  - hover
  - focus
  - selected
  - disabled
  - submitting
  - success
accessibility:
  keyboard: complete
  focusVisible: required
  screenReaderLabels: required
  contrast: wcagaa
  reducedMotion: supported
navigationTitles:
  console:
    workstations:
      cockpit: 经营驾驶舱
      control: 智慧翼中控台
      products: 商品治理台
