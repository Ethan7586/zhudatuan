version: 1
owner: platform
edge:
  waf: aliyun
  cdn: aliyun
  apiOrigin: alb
  staticOrigin: oss
routes:
  api:
    host: api.fufu.wang
    service: shop-api
    paths: [/api/v1, /health]
  storefront:
    host: fufu.wang
    artifact: storefront
    entryPath: /s
    fallback: index.html
  auth: { host: auth.fufu.wang, artifact: auth }
  console: { host: console.fufu.wang, artifact: console }
headers:
  hsts: max-age=63072000; includeSubDomains
  csp: default-src 'none'; frame-ancestors 'none'
  permissions: camera=(), microphone=(), geolocation=()
  referrer: no-referrer
cors:
  credentials: true
  wildcard: false
