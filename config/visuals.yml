      statements: 账单
      reconciliations: 对账
      settlements: 结算
      withdrawals: 提现
      invoices: 发票
      access: 权限中心
      members: 成员管理
      qualification: 资格管理
      notification: 通知管理
      productdetail: 商品详情
      orderdetail: 订单详情
    referral:
      system: 分销返佣系统
