server {
    listen 443 ssl;
    http2 on;
    server_name api.fufu.wang;

    ssl_certificate /etc/letsencrypt/live/fufu.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fufu.wang/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FufuSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 20m;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    access_log /www/wwwlogs/api.fufu.wang.log;
    error_log /www/wwwlogs/api.fufu.wang.error.log;
}
