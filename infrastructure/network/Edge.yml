version: 1
owner: platform
edge:
  waf: aliyun
  cdn: aliyun
  apiOrigin: alb
  staticOrigin: oss
routes:
  api:
    host: api.fufu.wang
    service: shop-api
    paths: [/api/v1, /health]
  storefront:
    host: fufu.wang
    artifact: storefront
    entryPath: /s
    fallback: index.html
  auth: { host: passport.fufu.wang, artifact: auth }
  console: { host: console.fufu.wang, artifact: console }
  miniapp: { host: miniapp.fufu.wang, artifact: miniapp }
  store: { host: store.fufu.wang, artifact: store }
  supplier: { host: supplier.fufu.wang, artifact: supplier }
headers:
  hsts: max-age=63072000; includeSubDomains
  contentTypeOptions: nosniff
  crossOriginOpenerPolicy: same-origin
  permissions: camera=(), microphone=(), geolocation=()
  referrer: no-referrer
  api:
    contentSecurityPolicy:
      default: [none]
      frameAncestors: [none]
  auth:
    contentSecurityPolicy:
      default: [none]
      script: [self]
      style: [self]
      image: [self, data]
      font: [self]
      connectRoutes: [api]
      formAction: [self]
      base: [none]
      object: [none]
      frameAncestors: [none]
      upgradeInsecureRequests: true
cors:
  credentials: true
  wildcard: false
