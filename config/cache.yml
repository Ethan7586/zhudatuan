version: 1
owner: platform
browser:
  query:
    staleMilliseconds: 30000
    garbageCollectionMilliseconds: 300000
    retryCount: 1
    refetchOnWindowFocus: false
    refetchOnReconnect: true
  identity:
    parts: [client, scopekind, scopeid, accessversion, resourceversion, resource, filter]
  storefrontIdentity:
    parts: [handle, mall, releaseversion, catalogversion, resource, filter]
  scopeChange:
    cancelPending: true
    removePrevious: true
    triggers: [scopekind, scopeid, membership, accessversion]
caches:
  experience:
    key: mall:version
    maximumSeconds: 86400
    staleSeconds: 30
    commandRevalidate: false
  storefrontentry:
    key: handle
    maximumSeconds: 60
    staleSeconds: 0
    commandRevalidate: true
  catalog:
    key: mall:listing:version
    maximumSeconds: 300
    staleSeconds: 30
    commandRevalidate: true
  category:
    key: mall:categoryversion
    maximumSeconds: 3600
    staleSeconds: 60
    commandRevalidate: true
  access:
    key: membership:authzversion:capabilityversion
    maximumSeconds: 60
    staleSeconds: 0
    commandRevalidate: true
  reporting:
    key: scope:metric:period:projectionversion
    maximumSeconds: 300
    staleSeconds: 60
    commandRevalidate: false
  session:
    key: session:version
    maximumSeconds: 60
    staleSeconds: 0
    commandRevalidate: true
