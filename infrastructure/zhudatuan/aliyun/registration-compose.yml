name: zhudatuan-registration

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    container_name: zhudatuan-registration-postgres
    restart: unless-stopped
    env_file:
      - /opt/zhudatuan/shared/postgres.env
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - registration
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /run/postgresql:noexec,nosuid,nodev
    volumes:
      - /var/lib/zhudatuan/postgres:/var/lib/postgresql/data
      - /opt/zhudatuan/current/infrastructure/zhudatuan/aliyun/postgres-init-registration.sh:/docker-entrypoint-initdb.d/10-registration-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 8s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M

networks:
  registration:
    internal: true
