    workbookEvidence:
      - sheet: 20250416需求汇总
        range: B9:C9
      - sheet: 20260430需求汇总
        range: J115:K116
    roles: [platformoperator, enterpriseoperator, departmentoperator, malloperator, supplieroperator, member]
    scopeHierarchy:
      kinds: [platform, enterprise, department, mall, supplier, owner]
      rule: 运营角色按组织后代查看，供应商按退货履约归属查看，会员只看本人申请。
    owner: order
    collaboratingModules: [payment, fulfillment, support, channel]
    uiRoute: /orders?workspace=aftersales
    uiRouteEvidence: [apps/console/src/route/ConsoleRouter.tsx]
    existingOperations: [order.aftersales.read, order.aftersales.apply, order.aftersales.approve, order.aftersales.reject]
    plannedOperations: []
    operationCoverage: 现有四个 Operation 覆盖列表、申请和审核决定，完整退货、退款、附件与时间线仍待后续闭环。
    dataObjectsAndProjections:
      - status: Existing
        target: ordering.aftersale-and-reviewaction
        evidence: [services/commerce/src/modules/order/OrderOperations.ts]
      - status: Designed
        target: reporting.aftersaleworkspaceprojection
        evidence: []
    successDefinition:
      - 售后列表、详情和时间线可追踪每次状态、数量、金额、证据与跨模块结果。
      - 无需退货退款、需退货退款、拒绝和完成均有确定终态。
    exceptionsAndRejections:
