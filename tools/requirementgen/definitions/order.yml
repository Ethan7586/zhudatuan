      Integration: 验证 Filter Snapshot、Watermark、对象 Hash 和幂等任务。
      Journey: 验证选择模板、创建任务、等待完成和下载。
      Browser: 验证导出对话框、进度、失败和过期状态。
      Performance: 验证一万行导出的分片时间、内存与对象大小。
      Recovery: 验证任务中断后从检查点恢复且 Hash 保持确定。
    runbookSlug: order-export-templates
    releaseEvidenceSlug: order-export-templates
    lifecycleStatus: Designed

  - id: OMS-008
    version: 1
    title: 售后工作台
    description: 统一展示和处理售后申请、审核、退货、收货、退款、拒绝与完成时间线，并保留订单和行级数量约束。
