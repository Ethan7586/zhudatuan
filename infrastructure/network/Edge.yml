version: 1
owner: platform
edge:
  waf: aliyun
  cdn: aliyun
  apiOrigin: alb
  staticOrigin: oss
  originAuthentication: mtls
  tls: { minimumVersion: '1.3', certificates: managed, renewalDaysBeforeExpiry: 30 }
resolution:
  hostSource: experience.domain
  scope: mall
  normalize: [lowercase, idna, trimTrailingDot]
  unknownHost: 404
  duplicateHost: failclosed
  cacheSeconds: 60
routes:
  api:
    host: api.fufu.wang
    service: shop-api
    paths: [/api/v1, /health]
  storefront:
    host: fufu.wang
    artifact: storefront
    entryPath: /s
    fallback: index.html
  auth: { host: passport.fufu.wang, artifact: auth }
  console: { host: console.fufu.wang, artifact: console }
  miniapp: { host: miniapp.fufu.wang, artifact: miniapp }
  store: { host: store.fufu.wang, artifact: store }
  supplier: { host: supplier.fufu.wang, artifact: supplier }
  upload: { host: upload.fufu.wang, service: object-upload, authentication: signedurl, publicRead: false }
  download: { host: download.fufu.wang, service: object-download, authentication: signedurl, publicList: false }
headers:
  hsts: max-age=63072000; includeSubDomains
  contentTypeOptions: nosniff
  crossOriginOpenerPolicy: same-origin
  permissions: camera=(), microphone=(), geolocation=()
  referrer: no-referrer
  api:
    contentSecurityPolicy:
      default: [none]
      frameAncestors: [none]
  auth:
    contentSecurityPolicy: &browsercsp
      default: [none]
      script: [self]
      style: [self]
      image: [self, data]
      font: [self]
      connectRoutes: [api]
      formAction: [self]
      base: [none]
      object: [none]
      frameAncestors: [none]
      upgradeInsecureRequests: true
  console:
    contentSecurityPolicy: *browsercsp
  storefront:
    contentSecurityPolicy: *browsercsp
  miniapp:
    contentSecurityPolicy: *browsercsp
  store:
    contentSecurityPolicy: *browsercsp
  supplier:
    contentSecurityPolicy: *browsercsp
cors: infrastructure/storage/Cors.yml
cache:
  immutableRelease: { key: releaseId+path+encoding, control: 'public,max-age=31536000,immutable' }
  releasePointer: { control: no-store, purgeOnPublish: true }
  api: { control: no-store, vary: [origin, authorization] }
  privateDownload: { control: private,no-store }
rate:
  apiAnonymous: { requestsPerMinute: 120, burst: 30, key: ip+host }
  apiAuthenticated: { requestsPerMinute: 600, burst: 100, key: tenant+actor+operation }
  authentication: { requestsPerMinute: 30, burst: 5, key: ip+principalHint }
  upload: { requestsPerMinute: 30, burst: 5, key: tenant+actor }
  webhook: { requestsPerMinute: 1200, burst: 200, key: provider+source }
  response: { status: 429, retryAfter: true, requestId: true }
