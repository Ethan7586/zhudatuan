name: Main Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zhudatuan-main-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: source, contract, database and build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: shop
      PGUSER: postgres
      PGPASSWORD: shop-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SHOP_TEST_REDIS_URL: redis://127.0.0.1:6379
      VITE_API_BASE_URL: http://127.0.0.1:3001
      VITE_AUTH_BASE_URL: http://127.0.0.1:5176
      VITE_CLIENT_VERSION: 0.0.0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: shop
          POSTGRES_PASSWORD: shop-ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d shop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install and verify selected source set
        run: |
          npm ci
          npm run check:cleaninstall
          npm run check:artifacts
          npm run check:approved-ui
          npm run check:registration-deployment
          npm run check:purchase-deployment

      - name: Verify immutable migrations and MVP kernel
        run: |
          npm run check:migrations
          npm run test:sql
          npm run test:mvp

      - name: Typecheck and deterministic tests
        run: |
          npm run typecheck
          npm run test:unit
          npm run test:contract
          npm run test:component
          npm run test:journey
          npm run test:security
          npm run test:performance

      - name: Verify real PostgreSQL and Redis adapters
        run: |
          npm run replay:postgres
          npm run test:integration
          npm run test:adapters

      - name: Build locked applications and services
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run release:console:verify -- --dist apps/console/dist --expected-commit "$GITHUB_SHA" --require-clean
          docker build --file infrastructure/aliyun/Dockerfile --tag zhudatuan-commerce:${{ github.sha }} .
          npm audit --omit=dev --audit-level=high

      - name: Ensure verification produced no source drift
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
