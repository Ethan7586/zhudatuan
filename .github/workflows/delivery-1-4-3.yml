name: Delivery Control 1.5
run-name: Delivery 1.5 ${{ inputs.operation }} ${{ inputs.head_sha }} ${{ inputs.release_target }} ${{ inputs.physical_node }}

# The only user-dispatchable normal delivery workflow. The system-level zdt-delivery
# command is the supported user entry; reusable jobs below are implementation details.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Normal delivery operation
        required: true
        type: choice
        options: [prepare, deploy, deploy-source]
      head_sha:
        description: Exact source SHA from zdt-next history
        required: true
        type: string
      release_target:
        description: Required for prepare and deploy; empty for deploy-source
        required: false
        type: string
      physical_node:
        description: Required for prepare and deploy; empty for deploy-source
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: zdt-next-delivery-1-5-${{ inputs.operation }}-${{ inputs.head_sha }}-${{ inputs.physical_node }}-${{ inputs.release_target }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate one 1.5 request
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate exact operation scope
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_SHA: ${{ inputs.head_sha }}
          RELEASE_TARGET: ${{ inputs.release_target }}
          PHYSICAL_NODE: ${{ inputs.physical_node }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'head_sha must be one full lowercase Git SHA' >&2; exit 64; }
          case "$OPERATION" in
            prepare|deploy)
              [ -n "$RELEASE_TARGET" ] && [ -n "$PHYSICAL_NODE" ] || { echo 'prepare/deploy require one target and physical node' >&2; exit 64; }
              ;;
            deploy-source)
              [ -z "$RELEASE_TARGET" ] && [ -z "$PHYSICAL_NODE" ] || { echo 'deploy-source accepts only the source SHA' >&2; exit 64; }
              ;;
            *) exit 64 ;;
          esac

  prepare:
    name: Prepare and Seal through 1.5
    needs: validate
    if: inputs.operation == 'prepare'
    uses: ./.github/workflows/auto-prepare-one-target.yml
    with:
      head_sha: ${{ inputs.head_sha }}
      release_target: ${{ inputs.release_target }}
      prepare_node: ${{ inputs.physical_node }}
      seal_nodes_json: ${{ format('["{0}"]', inputs.physical_node) }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}

  deploy:
    name: Deploy one sealed target through 1.5
    needs: validate
    if: inputs.operation == 'deploy'
    uses: ./.github/workflows/deploy-prepared-aliyun.yml
    with:
      auth_mode: static-access-key
      role_kind: releaser
      head_sha: ${{ inputs.head_sha }}
      release_target: ${{ inputs.release_target }}
      release_node: ${{ inputs.physical_node }}
      operation: deploy
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}

  deploy-source:
    name: Deploy sealed source through 1.5
    needs: validate
    if: inputs.operation == 'deploy-source'
    uses: ./.github/workflows/deploy-source-aliyun.yml
    with:
      head_sha: ${{ inputs.head_sha }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}
