version: 1
owner: zhudatuan
sourceOfTruth: 02_platform_pingtai/config/owner-approved-ui.json
runtime:
  releaseRoot: /opt/zhudatuan/current
  sharedRoot: /opt/zhudatuan/shared
  processConfig: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/ecosystem.config.cjs
  proxyConfig: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/Caddyfile
  acceptanceDataConfig: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/registration-compose.yml
  canonicalApiPort: 4321
  webBusinessApiPort: 4322
  webBusinessApiProfile: web-business-only
  purchaseApiPort: 4323
  purchaseApiProfile: purchase-only
  identityNotificationProfile: identity-notification-only
oneShots:
  registrationBoundaryReconcile:
    artifact: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/postgres-reconcile-registration-boundary.sql
    invocation: docker-compose-psql-stdin
    databaseRole: cluster-owner
    before:
      - registrationBootstrap
      - ownerBootstrap
    runtimeRoles:
      - zhudatuanbootstrap
      - shopmigration
    publicRuntimeRole: forbidden
  registrationBootstrap:
    artifact: 01_core_hexin/services/commerce/dist/BootstrapRegistration.js
    process: zhudatuan-registration-bootstrap.service
    service: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/systemd/zhudatuan-registration-bootstrap.service
    environment: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/registration-bootstrap.env.example
    output: /opt/zhudatuan/shared/registration-bootstrap/registration-invitation.json
    databaseRole: zhudatuanbootstrap
    publicOperatorRole: forbidden
  ownerBootstrap:
    artifact: 01_core_hexin/services/commerce/dist/BootstrapOwner.js
    process: zhudatuan-owner-bootstrap.service
    environment: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/owner-bootstrap.env.example
    databaseRole: zhudatuanbootstrap
    publicRegistrationRole: forbidden
routes:
  storefront:
    host: fufu.wang
    workspace: 01_core_hexin/apps/storefront-web
    artifact: 01_core_hexin/apps/storefront-web/dist
    process: zhudatuan-storefront
  accounts:
    host: accounts.fufu.wang
    workspace: 01_core_hexin/apps/auth-web
    artifact: 01_core_hexin/apps/auth-web/dist
    server: caddy-static
  console:
    host: console.fufu.wang
    workspace: 01_core_hexin/apps/console
    artifact: 01_core_hexin/apps/console/dist
    server: caddy-static
  api:
    host: api.fufu.wang
    workspace: 01_core_hexin/services/commerce
    artifact: 01_core_hexin/services/commerce/dist
    process: zhudatuan-api
    environment: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/identity-registration-api.env.example
    profile: registration-only
    port: 4321
  webBusinessApi:
    host: api.fufu.wang
    workspace: 01_core_hexin/services/commerce
    artifact: 01_core_hexin/services/commerce/dist/WebBusinessApiMain.js
    readinessArtifact: 01_core_hexin/services/commerce/dist/WebBusinessApiReadyMain.js
    process: zhudatuan-web-api
    service: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/systemd/zhudatuan-web-api.service
    environment: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/web-business-api.env.example
    profile: web-business-only
    port: 4322
    allowedPaths:
      - /api/v1/members/me
      - /api/v1/members/me/addresses
      - /api/v1/members/me/addresses/*
      - /api/v1/organizations/layers
      - /api/v1/reports/dashboard
      - /api/v1/catalog/listings
      - /api/v1/pricing/offers
      - /api/v1/inventory/availability
      - /api/v1/carts/current
      - /api/v1/carts/current/*
      - /api/v1/benefits/accounts
      - /api/v1/benefits/ledgers
      - /api/v1/orders
  purchaseApi:
    host: api.fufu.wang
    workspace: 01_core_hexin/services/commerce
    artifact: 01_core_hexin/services/commerce/dist/PurchaseApiMain.js
    readinessArtifact: 01_core_hexin/services/commerce/dist/PurchaseApiReadyMain.js
    process: zhudatuan-purchase-api
    service: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/systemd/zhudatuan-purchase-api.service
    environment: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/purchase-api.env.example
    profile: purchase-only
    port: 4323
    allowedMethods:
      - POST
    allowedPaths:
      - /api/v1/checkouts/quotes
      - /api/v1/orders
      - /api/v1/payments/intents
    preflightMethods:
      - OPTIONS
    preflightPaths:
      - /api/v1/checkouts/quotes
      - /api/v1/orders
      - /api/v1/payments/intents
    forbiddenOperations:
      - payment.refunds.request
      - payment.webhooks.wechat
      - payment.recoveries.read
      - payment.recoveries.resolve
  identityNotificationJobs:
    workspace: 01_core_hexin/services/commerce
    artifact: 01_core_hexin/services/commerce/dist
    process: zhudatuan-identity-notification-jobs
    profile: identity-notification-only
  media:
    host: media.zhudatuan.com
    root: /opt/zhudatuan/media
  chat:
    host: chat.zhudatuan.com
    status: pending
forbiddenInputs:
  - ../archives
  - 02_platform_pingtai/infrastructure/aliyun/delivery.yml
  - 02_platform_pingtai/infrastructure/storefront-compatibility/aliyun
  - 01_core_hexin/apps/auth
  - 01_core_hexin/apps/storefront
  - 01_core_hexin/services/commerce-api/dist/admin-server.cjs
release:
  publicCutover: blocked
  publicCutoverBlockReason: purchase-e2e-receipt-not-produced
  purchaseE2eReceiptSchema: 02_platform_pingtai/infrastructure/zhudatuan/aliyun/purchase-e2e-receipt.schema.json
  purchaseE2eReceipt: null
  buildFromCleanCheckout: true
  ownerManifestMustPass: true
  compatibilityMigrationBeforeRuntime: 20260828060000_auth_membership_selection_boundary.sql
  mediaMigrationBeforeWriteback: 20260828061000_catalog_media_domain_boundary.sql
  caddyValidateBeforeReload: true
  lifecycle:
    preflightCommand: /usr/local/sbin/zhudatuan-release-policy preflight
    postdeployCommand: /usr/local/sbin/zhudatuan-release-policy postdeploy
    scheduledCollector: zhudatuan-release-policy.timer
    pointerCollector: zhudatuan-release-policy.path
    keepRecentPerRoot: 12
    maximumReleasesPerRoot: 30
    releaseGraceHours: 12
    minimumFreeGiB: 15
    minimumFreePercent: 15
    incomingTtlHours: 2
    failedCandidateTtlHours: 24
    neverCollect:
      - current-pointer-targets
      - previous-pointer-targets
      - rollback-pointer-targets
      - running-process-releases
      - release-dependencies
      - manual-pins
      - database-backups
      - media
  publicCutoverRequiresRealSmsReceipt: true
  publicCutoverRequiresRegistrationE2e: true
  publicCutoverRequiresWebBusinessE2e: true
  publicCutoverRequiresPurchaseE2e: true
