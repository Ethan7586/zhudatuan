name: Deploy
run-name: Deploy ${{ inputs.head_sha }} ${{ inputs.release_node }} ${{ inputs.release_target }}

# Deployment channel 1.3 consumes an already prepared immutable OSS artifact.
# It never installs dependencies, tests, builds, packages, or publishes artifacts.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact 40-character source commit already prepared in OSS
        required: true
        type: string
      release_target:
        description: One prepared runtime target
        required: true
        type: choice
        options:
          - catalog-media
          - storefront
          - auth-web
          - console
          - identity-api
          - identity-notification-jobs
          - mall-provisioning-api
          - support-api
          - purchase-api
          - web-api
          - catalog-api
          - catalog-jobs
          - payment-webhook-api
          - payment-jobs
          - database-migration
      release_node:
        description: One sovereign node
        required: true
        type: choice
        options:
          - hbbtzn-l1
          - zhudatuan-l0

permissions:
  contents: read

concurrency:
  group: zdt-next-prepared-${{ inputs.release_node }}-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  RELEASE_SHA: ${{ inputs.head_sha }}
  RELEASE_NODE: ${{ inputs.release_node }}
  RELEASE_TARGET: ${{ inputs.release_target }}
  ZDT_RELEASE_SSH_HOST: root@123.57.232.253

jobs:
  deploy:
    name: OSS immutable artifact → ${{ inputs.release_node }}/${{ inputs.release_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact single-target request
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be one full lowercase Git commit SHA" >&2
            exit 64
          fi
          if [[ -z "$RELEASE_NODE" || -z "$RELEASE_TARGET" ]]; then
            echo "release_node and release_target are required" >&2
            exit 64
          fi

      - name: Load current release control plane only
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            04_tools/release-engine
            02_platform_pingtai/infrastructure/release/zdt-next.release.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Configure existing Aliyun transport
        env:
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 123.57.232.253 >> "$HOME/.ssh/known_hosts"

      - name: Resolve, verify, download and switch prepared artifact
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}
        run: |
          set -euo pipefail
          mkdir -p .direct-release
          npm run --silent release -- deploy-prepared \
            --source-sha "$RELEASE_SHA" \
            --node "$RELEASE_NODE" \
            --target "$RELEASE_TARGET" \
            --format json | tee .direct-release/deploy-envelope.json
          node -e "const r=require('./.direct-release/deploy-envelope.json');const x=r.result;if(!r.ok||x.finalStatus!=='success')process.exit(1);process.stdout.write('Prepared deploy: '+x.sourceSha+' '+x.target+' '+x.cacheStatus+' '+x.timings.total+'ms\\n')" \
            >> "$GITHUB_STEP_SUMMARY"
