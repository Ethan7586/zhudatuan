name: Prepare Artifact 1.3.5 - Aliyun / GitHub
run-name: Prepare 1.3.5 ${{ inputs.head_sha }} ${{ inputs.release_target }}${{ inputs.build_runner == 'github' && ' [github]' || '' }}

# Aliyun build runners are the default; GitHub standard runners are an explicit fallback. Two
# isolated empty release state roots must independently produce cold cache misses
# and byte-identical artifacts before OSS publication is allowed.
on:
  workflow_call:
    inputs:
      build_runner:
        description: Build runner (Aliyun default; GitHub hosted fallback)
        required: false
        default: aliyun
        type: string
      head_sha:
        description: Exact 40-character zdt-next source commit to build
        required: true
        type: string
      release_target:
        description: One runtime target to build and publish
        required: true
        type: string
      release_node:
        description: Physical node eligible for the prepared artifact
        required: true
        type: string
  workflow_dispatch:
    inputs:
      build_runner:
        description: Build runner (Aliyun default; GitHub hosted fallback)
        required: false
        default: aliyun
        type: choice
        options:
          - aliyun
          - github
      head_sha:
        description: Exact 40-character zdt-next source commit to build
        required: true
        type: string
      release_target:
        description: One runtime target to build and publish
        required: true
        type: choice
        options:
          - catalog-media
          - storefront
          - auth-web
          - console
          - identity-api
          - identity-notification-jobs
          - mall-provisioning-api
          - support-api
          - purchase-api
          - web-api
          - catalog-api
          - catalog-jobs
          - payment-webhook-api
          - payment-jobs
          - node-operations
          - database-migration
      release_node:
        description: Physical node eligible for the prepared artifact
        required: true
        type: choice
        options:
          - hbbtzn-l1
          - zhudatuan-l0

permissions:
  contents: read

concurrency:
  group: zdt-next-prepare-${{ inputs.head_sha }}-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  NPM_VERSION: 10.9.4
  RUNNER_IMAGE: ubuntu-24.04-x64
  RELEASE_SHA: ${{ inputs.head_sha }}
  RELEASE_TARGET: ${{ inputs.release_target }}
  RELEASE_NODE: ${{ inputs.release_node }}
  BUILD_RUNNER: ${{ inputs.build_runner }}
  CONTROL_SHA: ${{ github.sha }}
  CONTROL_REF: ${{ github.ref }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  GIT_HTTP_LOW_SPEED_LIMIT: 1024
  GIT_HTTP_LOW_SPEED_TIME: 20
  VITE_API_BASE_URL: https://api.hbbtzn.com
  VITE_AUTH_BASE_URL: https://accounts.hbbtzn.com
  VITE_ZHUDIAN_SOLUTION_ORIGIN: https://labs.hbbtzn.com
  VITE_CLIENT_VERSION: 0.0.0-g${{ inputs.head_sha }}

jobs:
  prepare:
    name: Two cold builds → immutable OSS artifact
    runs-on: ${{ fromJSON(inputs.build_runner == 'github' && '["ubuntu-24.04"]' || '["self-hosted","linux","x64","zdt-aliyun-build"]') }}
    timeout-minutes: 30
    steps:
      - name: Validate exact single-target request
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be one full lowercase Git commit SHA" >&2
            exit 64
          fi
          if [[ -z "$RELEASE_TARGET" ]]; then
            echo "release_target is required" >&2
            exit 64
          fi

      - name: Load latest control plane and exact source without remote Actions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date +%s%3N)"
          workspace="$(realpath "$GITHUB_WORKSPACE")"
          case "$workspace" in
            /opt/actions-runner-build/_work/zhudatuan/zhudatuan|/opt/actions-runner-build-2/_work/zhudatuan/zhudatuan|/home/runner/work/zhudatuan/zhudatuan) ;;
            *) echo "Unexpected build workspace: $workspace" >&2; exit 64 ;;
          esac
          control_root="$RUNNER_TEMP/zdt-control-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$control_root"
          mkdir -p "$control_root"
          find "$workspace" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          checkout_exact() {
            local directory="$1" sha="$2" depth="$3"
            shift 3
            local patterns=("$@")
            git init --quiet "$directory"
            git -C "$directory" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            git -C "$directory" config http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
            for attempt in 1 2 3; do
              if git -C "$directory" -c protocol.version=1 fetch --filter=blob:none --no-tags --no-recurse-submodules --depth="$depth" origin "$sha"; then
                if [ "${#patterns[@]}" -gt 0 ]; then
                  git -C "$directory" sparse-checkout init --no-cone
                  git -C "$directory" sparse-checkout set --no-cone "${patterns[@]}"
                fi
                git -C "$directory" checkout --force --detach "$sha"
                git -C "$directory" config --unset-all http.https://github.com/.extraheader
                return 0
              fi
              [ "$attempt" -lt 3 ] || return 1
              sleep "$((attempt * 5))"
            done
          }
          trap 'git -C "$workspace" config --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true; git -C "$control_root" config --unset-all http.https://github.com/.extraheader >/dev/null 2>&1 || true' EXIT
          checkout_exact "$control_root" "$CONTROL_SHA" 1 \
            package.json 04_tools/release-engine \
            02_platform_pingtai/infrastructure/release/zdt-next.release.json \
            02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json \
            02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts
          checkout_exact "$workspace" "$RELEASE_SHA" 2
          trap - EXIT
          printf 'RELEASE_CLI=%s\nRELEASE_ADAPTER=%s\n' \
            "$control_root/04_tools/release-engine/cli.mjs" \
            "$control_root/02_platform_pingtai/infrastructure/release/zdt-next.release.json" >> "$GITHUB_ENV"
          printf 'control_checkout_ms=%s\n' "$(( $(date +%s%3N) - started_at ))" > "$RUNNER_TEMP/zdt-runner-timings"

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

      - name: Verify source belongs to the exact zdt-next history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONTROL_REF" != "refs/heads/zdt-next" ]; then
            echo "Prepare Artifact must run from refs/heads/zdt-next" >&2
            exit 64
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_SHA}...${CONTROL_SHA}" --jq '.merge_base_commit.sha')"
          if [ "$merge_base" != "$RELEASE_SHA" ]; then
            echo "head_sha must belong to the exact zdt-next history" >&2
            exit 64
          fi

      - name: Activate preinstalled exact Node toolchain
        shell: bash
        run: |
          set -euo pipefail
          node_bin="$RUNNER_TOOL_CACHE/node/${NODE_VERSION}/x64/bin"
          if [ ! -x "$node_bin/node" ] || [ ! -x "$node_bin/npm" ]; then
            [ "$BUILD_RUNNER" = github ] || { echo 'Exact Node toolcache is missing on the Aliyun runner.' >&2; exit 1; }
            archive="$RUNNER_TEMP/node-v${NODE_VERSION}-linux-x64.tar.xz"
            curl -fL --retry 3 --retry-all-errors --connect-timeout 15 --max-time 180 \
              "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.xz" -o "$archive"
            printf '%s  %s\n' '9aa8e9d2298ab68c600bd6fb86a6c13bce11a4eca1ba9b39d79fa021755d7c37' "$archive" | sha256sum -c -
            mkdir -p "$node_bin"
            tar -xJf "$archive" --strip-components=1 -C "${node_bin%/bin}"
          fi
          export PATH="$node_bin:$PATH"
          printf '%s\n' "$node_bin" >> "$GITHUB_PATH"
          test "$($node_bin/node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Fix and verify build environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
          test "$(node -p 'process.platform')" = linux
          test "$(node -p 'process.arch')" = x64

      - name: Reuse an existing identical immutable artifact
        id: prepared
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .prepare-release/evidence
          node "$RELEASE_CLI" inspect-prepared \
            --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
            --source-sha "$RELEASE_SHA" --target "$RELEASE_TARGET" --node "$RELEASE_NODE" \
            --format json > .prepare-release/evidence/prepared-inspection.json
          exists="$(node -e "const r=require('./.prepare-release/evidence/prepared-inspection.json');process.stdout.write(String(r.ok&&r.result.exists))")"
          printf 'exists=%s\n' "$exists" >> "$GITHUB_OUTPUT"
          if [ "$exists" = true ]; then
            echo 'Exact immutable artifact already exists; skipped dependency install and both cold builds.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install build dependencies
        if: steps.prepared.outputs.exists != 'true'
        run: |
          started_at="$(date +%s%3N)"
          npm ci --ignore-scripts --no-audit --no-fund
          printf 'dependency_install_ms=%s\n' "$(( $(date +%s%3N) - started_at ))" >> "$RUNNER_TEMP/zdt-runner-timings"

      - name: Build and package twice from isolated empty state roots
        if: steps.prepared.outputs.exists != 'true'
        id: package
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_RUNNER" = aliyun ]; then
            lock_started="$(date +%s%3N)"
            exec 9>/run/lock/zdt-build/heavy.lock
            flock -w 1200 9
            printf 'heavy_build_wait_ms=%s\n' "$(( $(date +%s%3N) - lock_started ))" >> "$RUNNER_TEMP/zdt-runner-timings"
          fi
          base="$(git rev-parse HEAD^)"
          if [ "$RELEASE_TARGET" = "console" ]; then
            export SHOP_BUILD_COMMIT="$RELEASE_SHA"
            export SHOP_BUILD_BRANCH="zdt-next"
            export SHOP_BUILD_DIRTY="false"
            export SHOP_BUILD_ID="${RELEASE_SHA:0:12}"
            export SHOP_BUILD_AT="$(git show -s --format=%cI "$RELEASE_SHA")"
          fi
          mkdir -p .prepare-release/evidence
          run_cold_prepare() {
            local label="$1"
            local state=".prepare-release/state-${label}"
            local evidence=".prepare-release/evidence/${label}"
            local plan_path
            local build_path
            local status
            if [ -e "$state" ]; then
              echo "Cold Prepare state root already exists: $state" >&2
              return 1
            fi
            mkdir -p "$evidence" || return $?
            local cold_started="$(date +%s%3N)"
            node "$RELEASE_CLI" plan --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
              --state-directory "$state" \
              --from "$base" \
              --to "$RELEASE_SHA" \
              --target "$RELEASE_TARGET" \
              --prepare \
              --format json > "$evidence/plan-envelope.json" || {
                status=$?
                echo "Cold Prepare ${label} stopped during plan." >&2
                return "$status"
              }
            plan_path="$(node -e "const r=require('./$evidence/plan-envelope.json');if(!r.ok||!r.result.deployRequired||r.result.targets.length!==1)throw new Error('Prepare plan is not one target');process.stdout.write(r.result.planPath)")" || {
              status=$?
              echo "Cold Prepare ${label} stopped while validating the plan envelope." >&2
              return "$status"
            }
            node "$RELEASE_CLI" build --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
              --state-directory "$state" \
              --plan "$plan_path" \
              --format json > "$evidence/build-envelope.json" || {
                status=$?
                echo "Cold Prepare ${label} stopped during build." >&2
                return "$status"
              }
            build_path="$(node -e "const r=require('./$evidence/build-envelope.json');if(!r.ok)throw new Error('Build failed');process.stdout.write(r.result.buildPath)")" || {
              status=$?
              echo "Cold Prepare ${label} stopped while validating the build envelope." >&2
              return "$status"
            }
            node "$RELEASE_CLI" package --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
              --state-directory "$state" \
              --build "$build_path" \
              --format json > "$evidence/package-envelope.json" || {
                status=$?
                echo "Cold Prepare ${label} stopped during package." >&2
                return "$status"
              }
            node -e "const r=require('./$evidence/package-envelope.json');if(!r.ok||r.result.artifacts.length!==1||r.result.artifacts[0].packageCache!=='miss')throw new Error('Prepare package was not a cold cache miss');process.stdout.write(r.result.packagePath)" || {
              status=$?
              echo "Cold Prepare ${label} stopped while validating the package envelope." >&2
              return "$status"
            }
            printf 'cold_%s_ms=%s\n' "$label" "$(( $(date +%s%3N) - cold_started ))" >> "$RUNNER_TEMP/zdt-runner-timings"
          }
          if ! left_package="$(run_cold_prepare cold-a)"; then
            echo "Cold Prepare stopped after cold-a failed." >&2
            exit 1
          fi
          if ! right_package="$(run_cold_prepare cold-b)"; then
            echo "Cold Prepare stopped after cold-b failed." >&2
            exit 1
          fi
          node "$RELEASE_CLI" verify-reproducibility --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
            --left-package "$left_package" \
            --right-package "$right_package" \
            --output .prepare-release/reproducibility-evidence.json \
            --format json > .prepare-release/evidence/reproducibility-envelope.json
          printf 'package_path=%s\n' "$left_package" >> "$GITHUB_OUTPUT"

      - name: Run prepared Storefront artifact on Linux x64
        if: inputs.release_target == 'storefront' && steps.prepared.outputs.exists != 'true'
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
        run: |
          set -euo pipefail
          mkdir -p .prepare-release/storefront-runtime
          artifact_path="$(node -e "const p=require(process.env.PACKAGE_PATH);process.stdout.write(p.artifacts[0].archive.path)")"
          tar -xzf "$artifact_path" -C .prepare-release/storefront-runtime
          STOREFRONT_DIST=.prepare-release/storefront-runtime/app/dist \
            node "$(dirname "$RELEASE_CLI")/test/storefront-linux-runtime-fixture.mjs" \
            > .prepare-release/storefront-runtime-evidence.json

      - name: Publish immutable artifact and manifests to OSS
        if: steps.prepared.outputs.exists != 'true'
        id: publish
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.package_path }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_args=()
          if [ "$RELEASE_TARGET" = storefront ]; then
            runtime_args+=(--runtime-evidence .prepare-release/storefront-runtime-evidence.json)
          fi
          node "$RELEASE_CLI" publish --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
            --package "$PACKAGE_PATH" \
            --source-sha "$RELEASE_SHA" \
            --target "$RELEASE_TARGET" \
            --npm-version "$NPM_VERSION" \
            --runner-image "$RUNNER_IMAGE" \
            --repository "$GITHUB_REPOSITORY" \
            --output .prepare-release/prepare-receipt.json \
            "${runtime_args[@]}" \
            --format json | tee .prepare-release/evidence/publish-envelope.json
          node -e "const r=require('./.prepare-release/evidence/publish-envelope.json');const x=r.result;if(!r.ok)process.exit(1);process.stdout.write('Prepared: '+x.sourceSha+' '+x.target+' '+x.artifactIdentity+' '+x.cacheStatus+' '+x.timings.total+'ms\\n')" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve raw preparation evidence in immutable OSS
        if: always()
        continue-on-error: true
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .prepare-release/evidence
          STATUS="${{ job.status }}" node --input-type=module <<'NODE'
          import { existsSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { join, relative } from 'node:path';
          const root = '.prepare-release';
          const files = {};
          const visit = directory => {
            if (!existsSync(directory)) return;
            for (const name of readdirSync(directory).sort()) {
              const path = join(directory, name);
              if (statSync(path).isDirectory()) visit(path);
              else if (path.endsWith('.json') && !path.endsWith('workflow-evidence.json')) {
                const raw = readFileSync(path, 'utf8');
                try { files[relative(root, path)] = JSON.parse(raw); }
                catch (error) { files[relative(root, path)] = { parseError: error.message, raw }; }
              }
            }
          };
          visit(root);
          const timingPath = process.env.RUNNER_TEMP + '/zdt-runner-timings';
          const evidence = {
            schema: 'ai.delivery.workflow-evidence.v1', kind: 'prepare', status: process.env.STATUS,
            sourceSha: process.env.RELEASE_SHA, controlSha: process.env.CONTROL_SHA,
            target: process.env.RELEASE_TARGET, node: process.env.RELEASE_NODE,
            github: { runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT },
            timings: Object.fromEntries((existsSync(timingPath) ? readFileSync(timingPath, 'utf8') : '').trim().split('\n').filter(Boolean).map(line => line.split('='))),
            files, completedAt: new Date().toISOString(),
          };
          writeFileSync(root + '/workflow-evidence.json', JSON.stringify(evidence, null, 2) + '\n');
          NODE
          node "$RELEASE_CLI" publish-evidence \
            --adapter "$RELEASE_ADAPTER" --project-root "$GITHUB_WORKSPACE" \
            --file .prepare-release/workflow-evidence.json --kind prepare \
            --source-sha "$RELEASE_SHA" --target "$RELEASE_TARGET" \
            --github-run-id "$GITHUB_RUN_ID" --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --output .prepare-release/evidence-receipt.json --format json \
            >> "$GITHUB_STEP_SUMMARY"
