clarifications:
  - id: distributiondefinition
    requirements:
      - MVPDISTRIBUTION
    term: 分销层
    status: resolved
    blocking: false
    owner: product
    acceptance: 分销层定义为平台与租户之间的业务范围，拥有集团绑定、配额、佣金和渠道治理职责
    resolvedby: docs/architecture/福利商城理想方案20260904.md
    reason: 理想方案已给出唯一范围模型和分销层职责，历史“忽略”备注不再降低发布要求
  - &a1
    id: voucherarchive
    requirements:
      - MVPGROUPVOUCHER
      - MVPMALLVOUCHER
    term: 客户管理与产品档案
    status: resolved
    blocking: true
    owner: product
    acceptance: 客户归 Partner Customer 子域，产品档案归 Rich Voucher Product 与 Catalog，不在 Voucher 建第二份客户或商品主数据
    resolvedby: docs/architecture/福利商城理想方案20260904.md
    reason: 理想方案已经裁决归属，历史待确认项转换为必须通过的实现与迁移验收
  - &a2
    id: grouprisk
    requirements:
      - MVPGROUPSETTING
    term: 集团风控设置
    status: resolved
    blocking: true
    owner: product
    acceptance: 集团风控使用 Risk Policy 和 Case 聚合，策略启用需 Step-up、MakerChecker 与 Approval 证据
    resolvedby: docs/architecture/福利商城理想方案20260904.md
    reason: 理想方案已经定义风险策略对象、审批边界和质量门，历史待确认项不再开放
