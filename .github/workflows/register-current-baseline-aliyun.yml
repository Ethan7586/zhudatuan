name: Register Legacy Production Baseline - Aliyun Runner
run-name: Register baseline ${{ inputs.source_sha }} ${{ inputs.release_node }} ${{ inputs.release_target }}

# One-time 1.3 migration operation. This workflow records verifiable provenance
# for an already-running Legacy 1.2 release. It never builds, downloads, restarts,
# deploys, or changes current/previous/runtime pointers.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source SHA of the running Legacy 1.2 release
        required: true
        type: string
      legacy_artifact_sha256:
        description: Exact 64-character SHA-256 of the Legacy 1.2 archive
        required: true
        type: string
      legacy_run_id:
        description: Successful Legacy 1.2 GitHub Actions run id
        required: true
        type: string
      legacy_run_attempt:
        description: Legacy 1.2 run attempt
        required: true
        default: '1'
        type: string
      release_target:
        description: Exact physical target whose current pointer was recorded by the legacy run
        required: true
        type: choice
        options:
          - database-migration
          - catalog-media
          - storefront
          - auth-web
          - console
          - identity-api
          - identity-notification-jobs
          - mall-provisioning-api
          - support-api
          - purchase-api
          - web-api
          - catalog-api
          - catalog-jobs
          - payment-webhook-api
          - payment-jobs
      release_node:
        description: Exact sovereign node that owns the physical target
        required: true
        type: choice
        options:
          - hbbtzn-l1
          - zhudatuan-l0
permissions:
  actions: read
  contents: read

concurrency:
  group: zdt-next-baseline-${{ inputs.release_node }}-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  SOURCE_SHA: ${{ inputs.source_sha }}
  LEGACY_ARTIFACT_SHA256: ${{ inputs.legacy_artifact_sha256 }}
  LEGACY_RUN_ID: ${{ inputs.legacy_run_id }}
  LEGACY_RUN_ATTEMPT: ${{ inputs.legacy_run_attempt }}
  RELEASE_NODE: ${{ inputs.release_node }}
  RELEASE_TARGET: ${{ inputs.release_target }}
  CONTROL_SHA: ${{ github.sha }}
  CONTROL_REF: ${{ github.ref }}
  ZDT_RELEASE_SSH_HOST: root@123.57.232.253

jobs:
  register:
    name: Prove and register ${{ inputs.release_node }}/${{ inputs.release_target }}
    runs-on: [self-hosted, linux, x64, zdt-aliyun-release]
    timeout-minutes: 5
    steps:
      - name: Validate migration request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source and control-plane SHAs must be full lowercase Git commit SHAs" >&2
            exit 64
          fi
          if [[ ! "$LEGACY_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "legacy artifact SHA-256 must be 64 lowercase hexadecimal characters" >&2
            exit 64
          fi
          if [[ ! "$LEGACY_RUN_ID" =~ ^[1-9][0-9]*$ ]] || [[ ! "$LEGACY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
            echo "legacy run id and attempt must be positive integers" >&2
            exit 64
          fi
          if [ "$CONTROL_REF" != "refs/heads/zdt-next" ]; then
            echo "baseline registration must run from refs/heads/zdt-next" >&2
            exit 64
          fi

      - name: Load exact migration control plane only
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            04_tools/release-engine
            02_platform_pingtai/infrastructure/release/zdt-next.release.json
            02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json
            02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Configure existing Aliyun transport
        env:
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          install -m 600 02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -F 123.57.232.253 -f "$HOME/.ssh/known_hosts" >/dev/null
          printf '%s\n' \
            'Host 123.57.232.253' \
            '  HostKeyAlgorithms ssh-ed25519' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Verify legacy receipt and register immutable provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .baseline-registration
          expected_agent_sha256="sha256:$(sha256sum 04_tools/release-engine/remote/agent.mjs | cut -d' ' -f1)"
          expected_policy_sha256="sha256:$(sha256sum 02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json | cut -d' ' -f1)"
          npm run --silent release -- register-current-baseline \
            --source-sha "$SOURCE_SHA" \
            --control-sha "$CONTROL_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-remote-agent-sha256 "$expected_agent_sha256" \
            --expected-remote-policy-sha256 "$expected_policy_sha256" \
            --legacy-artifact-sha256 "$LEGACY_ARTIFACT_SHA256" \
            --legacy-run-id "$LEGACY_RUN_ID" \
            --legacy-run-attempt "$LEGACY_RUN_ATTEMPT" \
            --repository "$GITHUB_REPOSITORY" \
            --node "$RELEASE_NODE" \
            --target "$RELEASE_TARGET" \
            --format json | tee .baseline-registration/receipt.json
          node -e "const r=require('./.baseline-registration/receipt.json');const x=r.result;if(!r.ok||x.remote.current.unchanged!==true||x.remote.process.unchanged!==true)process.exit(1);process.stdout.write('registered: '+x.node+'/'+x.target+' source='+x.sourceSha+' pointer=unchanged process=unchanged\n')" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve baseline registration receipt
        uses: actions/upload-artifact@v4
        with:
          name: baseline-${{ inputs.release_target }}-${{ inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .baseline-registration/receipt.json
          if-no-files-found: error
          retention-days: 90
