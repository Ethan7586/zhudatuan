version: 1
owner: zhudatuan
sourceOfTruth: config/owner-approved-ui.json
runtime:
  releaseRoot: /opt/zhudatuan/current
  sharedRoot: /opt/zhudatuan/shared
  processConfig: infrastructure/zhudatuan/aliyun/ecosystem.config.cjs
  proxyConfig: infrastructure/zhudatuan/aliyun/Caddyfile
  acceptanceDataConfig: infrastructure/zhudatuan/aliyun/registration-compose.yml
  canonicalApiPort: 4321
  webBusinessApiPort: 4322
  webBusinessApiProfile: web-business-only
  purchaseApiPort: 4323
  purchaseApiProfile: purchase-only
  paymentWebhookApiPort: 4326
  paymentWebhookApiProfile: payment-webhook-only
  mallProvisioningApiPort: 4325
  mallProvisioningApiProfile: mall-provisioning-only
  identityNotificationProfile: identity-notification-only
oneShots:
  paymentWebhookRole:
    artifact: infrastructure/zhudatuan/aliyun/postgres-provision-payment-webhook-role.sh
    environment: infrastructure/zhudatuan/aliyun/payment-webhook-role.env.example
    invocation: cluster-authority-psql
    databaseRole: cluster-owner
    before:
      - registrationMigration
    createsRuntimeRole: zhudatuanpaymentwebhookapi
  mallProvisioningRole:
    artifact: infrastructure/zhudatuan/aliyun/postgres-provision-mall-role.sh
    environment: infrastructure/zhudatuan/aliyun/mall-provisioning-role.env.example
    invocation: cluster-authority-psql
    databaseRole: cluster-owner
    before:
      - registrationMigration
    createsRuntimeRole: zhudatuanprovisioningapi
  registrationBoundaryReconcile:
    artifact: infrastructure/zhudatuan/aliyun/postgres-reconcile-registration-boundary.sql
    invocation: docker-compose-psql-stdin
    databaseRole: cluster-owner
    before:
      - registrationBootstrap
      - ownerBootstrap
    runtimeRoles:
      - zhudatuanbootstrap
      - shopmigration
    publicRuntimeRole: forbidden
  registrationBootstrap:
    artifact: services/commerce/dist/BootstrapRegistration.js
    process: zhudatuan-registration-bootstrap.service
    service: infrastructure/zhudatuan/aliyun/systemd/zhudatuan-registration-bootstrap.service
    environment: infrastructure/zhudatuan/aliyun/registration-bootstrap.env.example
    output: /opt/zhudatuan/shared/registration-bootstrap/registration-invitation.json
    databaseRole: zhudatuanbootstrap
    publicOperatorRole: forbidden
  ownerBootstrap:
    artifact: services/commerce/dist/BootstrapOwner.js
    process: zhudatuan-owner-bootstrap.service
    environment: infrastructure/zhudatuan/aliyun/owner-bootstrap.env.example
    databaseRole: zhudatuanbootstrap
    publicRegistrationRole: forbidden
routes:
  storefront:
    host: zhudatuan.com
    workspace: apps/storefront-web
    artifact: apps/storefront-web/dist
    process: zhudatuan-storefront
  accounts:
    host: accounts.zhudatuan.com
    workspace: apps/auth-web
    artifact: apps/auth-web/dist
    server: caddy-static
  console:
    host: console.zhudatuan.com
    workspace: apps/console
    artifact: apps/console/dist
    server: caddy-static
  api:
    host: api.zhudatuan.com
    workspace: services/commerce
    artifact: services/commerce/dist
    process: zhudatuan-api
    environment: infrastructure/zhudatuan/aliyun/identity-registration-api.env.example
    profile: registration-only
    port: 4321
  webBusinessApi:
    host: api.zhudatuan.com
    workspace: services/commerce
    artifact: services/commerce/dist/WebBusinessApiMain.js
    readinessArtifact: services/commerce/dist/WebBusinessApiReadyMain.js
    process: zhudatuan-web-api
    service: infrastructure/zhudatuan/aliyun/systemd/zhudatuan-web-api.service
    environment: infrastructure/zhudatuan/aliyun/web-business-api.env.example
    profile: web-business-only
    port: 4322
    allowedPaths:
      - /api/v1/members/me
      - /api/v1/members/me/addresses
      - /api/v1/members/me/addresses/*
      - /api/v1/organizations/layers
      - /api/v1/reports/dashboard
      - /api/v1/catalog/listings
      - /api/v1/pricing/offers
      - /api/v1/inventory/availability
      - /api/v1/carts/current
      - /api/v1/carts/current/*
      - /api/v1/benefits/accounts
      - /api/v1/benefits/ledgers
      - /api/v1/orders
  purchaseApi:
    host: api.zhudatuan.com
    workspace: services/commerce
    artifact: services/commerce/dist/PurchaseApiMain.js
    readinessArtifact: services/commerce/dist/PurchaseApiReadyMain.js
    process: zhudatuan-purchase-api
    service: infrastructure/zhudatuan/aliyun/systemd/zhudatuan-purchase-api.service
    environment: infrastructure/zhudatuan/aliyun/purchase-api.env.example
    profile: purchase-only
    port: 4323
    allowedMethods:
      - POST
    allowedPaths:
      - /api/v1/checkouts/quotes
      - /api/v1/orders
      - /api/v1/payments/intents
    preflightMethods:
      - OPTIONS
    preflightPaths:
      - /api/v1/checkouts/quotes
      - /api/v1/orders
      - /api/v1/payments/intents
    forbiddenOperations:
      - payment.refunds.request
      - payment.webhooks.wechat
      - payment.recoveries.read
      - payment.recoveries.resolve
  paymentWebhookApi:
    host: api.zhudatuan.com
    workspace: services/commerce
    artifact: services/commerce/dist/PaymentWebhookApiMain.js
    readinessArtifact: services/commerce/dist/PaymentWebhookApiReadyMain.js
    process: zhudatuan-payment-webhook-api
    service: infrastructure/zhudatuan/aliyun/systemd/zhudatuan-payment-webhook-api.service
    environment: infrastructure/zhudatuan/aliyun/payment-webhook-api.env.example
    profile: payment-webhook-only
    databaseRole: zhudatuanpaymentwebhookapi
    roleProvisioner: infrastructure/zhudatuan/aliyun/postgres-provision-payment-webhook-role.sh
    port: 4326
    allowedMethods:
      - POST
    allowedPaths:
      - /api/v1/webhooks/wechat/payment
    forbiddenOperations:
      - payment.intents.create
      - payment.refunds.request
      - payment.recoveries.read
      - payment.recoveries.resolve
  mallProvisioningApi:
    host: api.zhudatuan.com
    workspace: services/commerce
    artifact: services/commerce/dist/MallProvisioningApiMain.js
    readinessArtifact: services/commerce/dist/MallProvisioningApiReadyMain.js
    process: zhudatuan-mall-provisioning-api
    service: infrastructure/zhudatuan/aliyun/systemd/zhudatuan-mall-provisioning-api.service
    environment: infrastructure/zhudatuan/aliyun/mall-provisioning-api.env.example
    profile: mall-provisioning-only
    databaseRole: zhudatuanprovisioningapi
    port: 4325
    allowedMethods:
      - POST
      - GET
    allowedPaths:
      - /api/v1/provisioning/malls
      - /api/v1/provisioning/malls/*
    preflightMethods:
      - OPTIONS
    preflightPaths:
      - /api/v1/provisioning/malls
  identityNotificationJobs:
    workspace: services/commerce
    artifact: services/commerce/dist
    process: zhudatuan-identity-notification-jobs
    profile: identity-notification-only
  media:
    host: media.zhudatuan.com
    root: /opt/zhudatuan/media
  labs:
    host: labs.zhudatuan.com
    transactionApi: disabled
  chat:
    host: chat.zhudatuan.com
    status: pending
forbiddenInputs:
  - ../archives
  - infrastructure/aliyun/delivery.yml
  - infrastructure/storefront-compatibility/aliyun
  - apps/auth
  - apps/storefront
  - services/commerce-api/dist/admin-server.cjs
release:
  publicCutover: blocked
  publicCutoverBlockReason: purchase-e2e-receipt-not-produced
  purchaseE2eReceiptSchema: infrastructure/zhudatuan/aliyun/purchase-e2e-receipt.schema.json
  purchaseE2eReceipt: null
  buildFromCleanCheckout: true
  ownerManifestMustPass: true
  compatibilityMigrationBeforeRuntime: 20260828060000_auth_membership_selection_boundary.sql
  mediaMigrationBeforeWriteback: 20260828061000_catalog_media_domain_boundary.sql
  caddyValidateBeforeReload: true
  publicCutoverRequiresRealSmsReceipt: true
  publicCutoverRequiresRegistrationE2e: true
  publicCutoverRequiresWebBusinessE2e: true
  publicCutoverRequiresPurchaseE2e: true
