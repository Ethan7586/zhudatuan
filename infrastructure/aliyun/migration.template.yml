apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-runtime
  namespace: SHOP_NAMESPACE
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-migration-SHOP_RELEASE_ID
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-migration, shop.release/id: SHOP_RELEASE_ID }
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-migration, shop.release/id: SHOP_RELEASE_ID }
    spec:
      restartPolicy: Never
      serviceAccountName: shop-runtime
      containers:
        - name: migration
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["services/commerce/dist/MigrationMain.js"]
          envFrom:
            - configMapRef: { name: shop-migration }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { cpu: "4", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
