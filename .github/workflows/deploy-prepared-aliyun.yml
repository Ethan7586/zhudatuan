name: Validate or Deploy 1.4.3 - Reusable
run-name: Delivery child 1.4.3 ${{ inputs.operation }} ${{ inputs.head_sha }} ${{ inputs.release_node }} ${{ inputs.release_target }}

# Reusable 1.4.3 child. Deploy verifies the exact prepared artifact and switches
# production inside one locked remote action. Optional candidate validation remains diagnostic
# and never becomes a prerequisite or cross-run gate for deployment.
on:
  workflow_call:
    inputs:
      head_sha:
        description: Exact 40-character source commit already prepared in OSS
        required: true
        type: string
      release_target:
        description: One prepared runtime target
        required: true
        type: string
      release_node:
        description: One sovereign node
        required: true
        type: string
      operation:
        description: Validate a candidate or atomically deploy it
        required: true
        type: string
    secrets:
      ZDT_RUNNER_READ_TOKEN:
        description: Fine-grained token limited to repository Administration read for Primary health observation
        required: true
permissions:
  contents: read

concurrency:
  group: zdt-next-prepared-${{ inputs.release_node }}-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  RELEASE_SHA: ${{ inputs.head_sha }}
  RELEASE_NODE: ${{ inputs.release_node }}
  RELEASE_TARGET: ${{ inputs.release_target }}
  RELEASE_OPERATION: ${{ inputs.operation }}
  CONTROL_SHA: ${{ github.sha }}
  CONTROL_REF: ${{ github.ref }}
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: http.version
  GIT_CONFIG_VALUE_0: HTTP/1.1
  GIT_HTTP_LOW_SPEED_LIMIT: 1024
  GIT_HTTP_LOW_SPEED_TIME: 20
  ZDT_RELEASE_SSH_HOST: root@123.57.232.253

jobs:
  prepared:
    name: ${{ inputs.operation }} OSS artifact → ${{ inputs.release_node }}/${{ inputs.release_target }}
    runs-on: [self-hosted, linux, x64, zdt-aliyun-release]
    timeout-minutes: 5
    steps:
      - name: Validate exact request
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source and control-plane SHAs must be full lowercase Git commit SHAs" >&2
            exit 64
          fi
          if [[ -z "$RELEASE_NODE" || -z "$RELEASE_TARGET" ]]; then
            echo "release_node and release_target are required" >&2
            exit 64
          fi
          if [ "$RELEASE_OPERATION" != validate-candidate ] && [ "$RELEASE_OPERATION" != deploy ]; then
            echo "operation must be validate-candidate or deploy" >&2
            exit 64
          fi

      - name: Load exact release control plane only
        id: checkout_control
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            04_tools/release-engine
            02_platform_pingtai/infrastructure/release/zdt-next.release.json
            02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json
            02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts

      - name: Back off after a transient GitHub checkout failure
        if: steps.checkout_control.outcome == 'failure'
        shell: bash
        run: sleep 5

      - name: Retry exact release control plane checkout with compatibility protocol
        if: steps.checkout_control.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config extensions.partialClone origin
          git config remote.origin.promisor true
          git config remote.origin.partialCloneFilter blob:none
          git config protocol.version 1
          for attempt in 1 2 3; do
            if git -c protocol.version=1 fetch \
              --filter=blob:none --no-tags --prune --no-recurse-submodules --depth=1 \
              origin "$CONTROL_SHA"; then
              git sparse-checkout init --no-cone
              git sparse-checkout set --no-cone \
                package.json \
                04_tools/release-engine \
                02_platform_pingtai/infrastructure/release/zdt-next.release.json \
                02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json \
                02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts
              git checkout --force --detach "$CONTROL_SHA"
              git clean -ffdx
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          exit 1

      - name: Verify exact control-plane checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$CONTROL_SHA"

      - name: Verify source belongs to the exact zdt-next history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONTROL_REF" != "refs/heads/zdt-next" ]; then
            echo "Delivery 1.4.3 must run from refs/heads/zdt-next" >&2
            exit 64
          fi
          merge_base="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_SHA}...${CONTROL_SHA}" --jq '.merge_base_commit.sha')"
          if [ "$merge_base" != "$RELEASE_SHA" ]; then
            echo "head_sha must belong to the exact zdt-next history" >&2
            exit 64
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Classify the Release writer without treating labels as authority
        env:
          GH_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          primary='aliyun-staging-zdt-release'
          standby='aliyun-staging-zdt-release-standby'
          case "$RUNNER_NAME" in
            "$primary")
              printf 'WRITER_CLASS=primary\nPRIMARY_AVAILABLE=true\nTAKEOVER_REASON=none\n' >> "$GITHUB_ENV"
              echo '主Release执行中。'
              ;;
            "$standby")
              mkdir -p .prepared-release
              for attempt in 1 2 3; do
                if gh api "repos/${GITHUB_REPOSITORY}/actions/runners" > .prepared-release/release-runners.json 2> .prepared-release/release-runners.error; then break; fi
                if ! grep -Eqi 'reset|timed out|temporar|502|503|504' .prepared-release/release-runners.error || [ "$attempt" -eq 3 ]; then
                  echo "code=RELEASE_PRIMARY_STATUS_UNAVAILABLE stage=release-writer-selection retryable=false attempts=${attempt} next_safe_action=stop-without-production-connection" >&2
                  exit 1
                fi
                sleep "$((attempt * 2))"
              done
              primary_status="$(node -e "const r=require('./.prepared-release/release-runners.json');const x=r.runners.find(v=>v.name===process.argv[1]);process.stdout.write(x?.status??'missing')" "$primary")"
              if [ "$primary_status" = online ]; then
                echo '无法证明唯一写者，发布已停止。' >&2
                exit 1
              fi
              printf 'WRITER_CLASS=standby\nPRIMARY_AVAILABLE=false\nTAKEOVER_REASON=primary-release-%s-after-lease-expiry\n' "$primary_status" >> "$GITHUB_ENV"
              echo 'Standby将在主租约过期后尝试安全接管。'
              ;;
            *)
              echo "code=RELEASE_WRITER_IDENTITY_UNKNOWN stage=release-writer-selection retryable=false attempts=1 next_safe_action=stop-without-production-connection" >&2
              exit 1
              ;;
          esac

      - name: Refuse logical aliases for a different physical node
        shell: bash
        run: |
          node -e 'const c=require("./02_platform_pingtai/infrastructure/release/zdt-next.release.json");const d=c.nodes[process.env.RELEASE_NODE]?.deployments?.[process.env.RELEASE_TARGET];if(!d)process.exit(64);if(d.hostedBy&&d.hostedBy!==process.env.RELEASE_NODE){console.error(`Requested ${process.env.RELEASE_NODE}/${process.env.RELEASE_TARGET} is physically hosted by ${d.hostedBy}; deploy the physical node explicitly.`);process.exit(64)}'

      - name: Verify control-plane checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(node --version)" = "v${NODE_VERSION}"

      - name: Configure existing Aliyun transport
        env:
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          install -m 600 02_platform_pingtai/infrastructure/release/zdt-next.ssh-known-hosts "$HOME/.ssh/known_hosts"
          ssh-keygen -F 123.57.232.253 -f "$HOME/.ssh/known_hosts" >/dev/null
          printf '%s\n' \
            'Host 123.57.232.253' \
            '  HostKeyAlgorithms ssh-ed25519' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  UserKnownHostsFile ~/.ssh/known_hosts' \
            > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Resolve, verify and process prepared artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .prepared-release
          command=validate-prepared
          expected_status=sealed
          if [ "$RELEASE_OPERATION" = deploy ]; then
            command=deploy-prepared
            expected_status=success
          fi
          expected_agent_sha256="sha256:$(sha256sum 04_tools/release-engine/remote/agent.mjs | cut -d' ' -f1)"
          expected_policy_sha256="sha256:$(sha256sum 02_platform_pingtai/infrastructure/release/zdt-next.remote-policy.json | cut -d' ' -f1)"
          npm run --silent release -- "$command" \
            --source-sha "$RELEASE_SHA" \
            --control-sha "$CONTROL_SHA" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-remote-agent-sha256 "$expected_agent_sha256" \
            --expected-remote-policy-sha256 "$expected_policy_sha256" \
            --writer-identity "$RUNNER_NAME" \
            --writer-class "$WRITER_CLASS" \
            --primary-available "$PRIMARY_AVAILABLE" \
            --takeover-reason "$TAKEOVER_REASON" \
            --node "$RELEASE_NODE" \
            --target "$RELEASE_TARGET" \
            --format json | tee .prepared-release/envelope.json
          EXPECTED_STATUS="$expected_status" node -e "const r=require('./.prepared-release/envelope.json');const x=r.result;if(!r.ok||x.finalStatus!==process.env.EXPECTED_STATUS)process.exit(1);const w=x.writerLease;const message=x.repeatedDeployment?'目标已是当前版本，无需重复切换。':w.writerClass==='standby'?'Standby已安全接管。':'主Release执行中。';process.stdout.write(message+' '+x.finalStatus+': artifact='+x.artifactSourceSha+' control='+x.controlPlane.sourceSha+' writer='+w.activeWriter+' lease='+w.leaseGeneration+'/'+w.leaseStatus+' switched='+x.actualSwitch+' '+x.timings.total+'ms\\n')" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve candidate or deployment receipt
        uses: actions/upload-artifact@v4
        with:
          name: prepared-${{ inputs.operation }}-${{ inputs.release_target }}-${{ inputs.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .prepared-release/envelope.json
          if-no-files-found: error
          retention-days: 90
