name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        description: Promote the signed staging candidate to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  SHOP_CI_DATABASE_PASSWORD: shop-ci-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: shop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: ci/01-15 immutable verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: shop
