schema: zhudatuan.project-deployment.v1
project: hbbtzn
provider: aliyun
enabled: true
mode: node-isolated

domains:
  storefront: hbbtzn.com
  storefrontAlias: www.hbbtzn.com
  console: console.hbbtzn.com
  accounts: accounts.hbbtzn.com
  api: api.hbbtzn.com

artifacts:
  manifest: ../../../config/artifacts.json
  copySourceCode: false

isolation:
  compute: dedicated-namespace
  database: dedicated-database
  cache: dedicated-instance-or-prefix
  objects: dedicated-bucket-or-prefix
  secrets: dedicated-secret-scope
  release: independent
  rollback: independent

runtime:
  nodeId: node:hbbtzn:l1
  storefrontReleasePointer: /opt/sfl/nodes/hbbtzn-l1/storefront/current
  storefrontService: sfl-storefront@hbbtzn-l1.service
  storefrontPort: 4410

legacyReferences:
  - ../../../infrastructure/aliyun/delivery.yml
  - ../../../infrastructure/storefront-compatibility/aliyun/Caddyfile

approval:
  owner: Ethan
  deploymentApproved: true
