schema: sfl.node-deployment.v1
project: hbbtzn
provider: aliyun
enabled: true
mode: branded-node-shared-business-kernel
deploymentState: shared-kernel-candidate-not-cut-over

node:
  nodeId: node:hbbtzn:l1
  realmRef: realm:l1
  mallId: mall:d1708f04df2dd8a61736852c4900fb43
  manifest: ../../../../config/node-manifests/hbbtzn-l1.json

domains:
  storefront: hbbtzn.com
  storefrontAliases:
    - www.hbbtzn.com
    - h5.hbbtzn.com
    - mall.hbbtzn.com
  console: console.hbbtzn.com
  accounts: accounts.hbbtzn.com
  api: api.hbbtzn.com

isolation:
  dataScope: realm-and-mall-scoped
  databaseTopology: shared-host-database
  resourceBindings: node-scoped
  secretBindings: node-scoped
  paymentBindings: node-scoped
  callbackBindings: node-scoped
  brandedEdgeReleasePointer: independent
  businessKernelReleasePointer: host-node-owned
  businessExecutionHostNodeId: node:zhudatuan:l0

runtime:
  releasePointer: /opt/sfl/nodes/hbbtzn-l1/current
  requestContextResolution: preserved-host-to-server-node-context
  services:
    - unit: sfl-storefront@hbbtzn-l1.service
      responsibility: storefront
    - unit: sfl-identity-notification-jobs@hbbtzn-l1.service
      responsibility: identity-realm-notification-jobs
    - unit: sfl-api-gateway@hbbtzn-l1.service
      responsibility: node-local-tls-gateway
      port: 4430
    - unit: sfl-cloudflared@hbbtzn-l1.service
      responsibility: node-owned-edge-tunnel
  sharedBusinessServices:
    - unit: zhudatuan-api.service
      responsibility: identity-api
      port: 4321
    - unit: zhudatuan-web-api.service
      responsibility: web-business-api
      port: 4322
    - unit: zhudatuan-purchase-api.service
      responsibility: purchase-api
      port: 4323
    - unit: zhudatuan-console-support.service
      responsibility: support-api
      port: 4324
    - unit: zhudatuan-payment-webhook-api.service
      responsibility: payment-webhook-api
      port: 4326
    - unit: zhudatuan-catalog-api.service
      responsibility: catalog-api
      port: 4331

targetEdge:
  standard: SFL-1.6
  publicHostname: api.hbbtzn.com
  tunnelCredential: /opt/sfl/nodes/hbbtzn-l1/tunnel/credentials.json
  tunnelConfiguration: /opt/sfl/nodes/hbbtzn-l1/runtime/cloudflared.yml
  origin: https://127.0.0.1:4430
  hostPolicy: preserve-node-host-and-sni
  fallbackPolicy: fail-closed-no-cross-node-route
  workerRouteCount: 0

compatibility:
  status: node-local-business-runtimes-production-active-pending-retirement
  boundary: SFL-COMPAT-01
  edgeWorker: hbbtzn-alias
  retirementOrder:
    - verify-independent-l1-candidate
    - bind-hbbtzn-hostnames-to-l1-tunnel
    - prove-l1-traffic-and-l0-zero-change
    - remove-worker-routes
    - prove-worker-zero-traffic
  productionCurrentSharedPhysicalRuntimes:
    - responsibility: identity
      unit: zhudatuan-internal-api.service
      canonicalNodeResolution: trusted-entry-host-to-NodeContext
    - responsibility: purchase
      unit: zhudatuan-purchase-api.service
      canonicalNodeResolution: trusted-public-host-to-NodeContext
  retirementTargets:
    - sfl-catalog-api@hbbtzn-l1.service
    - sfl-catalog-jobs@hbbtzn-l1.service
    - sfl-web-api@hbbtzn-l1.service
    - sfl-identity-api@hbbtzn-l1.service
    - sfl-purchase-api@hbbtzn-l1.service
    - sfl-payment-webhook-api@hbbtzn-l1.service
    - sfl-payment-jobs@hbbtzn-l1.service
  forbiddenClaims:
    - dedicated-physical-database
    - production-worker-retired-before-cutover-evidence

approval:
  owner: Ethan
  deploymentApproved: true
