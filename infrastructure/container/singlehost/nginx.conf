map $host $smartwiston_web_root {
    hostnames;
    default                   /opt/smart-wiston/current/apps/storefront;
    yengze.press              /opt/smart-wiston/current/apps/storefront;
    passport.yengze.press     /opt/smart-wiston/current/apps/auth;
    console.yengze.press      /opt/smart-wiston/current/apps/console;
    store.yengze.press        /opt/smart-wiston/current/apps/store;
    supplier.yengze.press     /opt/smart-wiston/current/apps/supplier;
}

map $uri $smartwiston_cache_control {
    default       "public, max-age=0, s-maxage=60, must-revalidate";
    ~^/assets/    "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name
        yengze.press
        www.yengze.press
        api.yengze.press
        passport.yengze.press
        console.yengze.press
        miniapp.yengze.press
        store.yengze.press
        supplier.yengze.press
        img.yengze.press
        upload.yengze.press
        download.yengze.press;

    root /opt/smart-wiston/shared/acme;

    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.yengze.press;

    ssl_certificate /etc/letsencrypt/live/yengze.press/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yengze.press/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SmartWistonTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    return 308 https://yengze.press$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name
        yengze.press
        passport.yengze.press
        console.yengze.press
        store.yengze.press
        supplier.yengze.press;

    root $smartwiston_web_root;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/yengze.press/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yengze.press/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SmartWistonTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https://img.yengze.press; font-src 'self'; connect-src 'self' https://api.yengze.press; form-action 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header Cache-Control $smartwiston_cache_control always;

    location = /index.html {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.map$ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /www/wwwlogs/yengze.press.log;
    error_log /www/wwwlogs/yengze.press.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.yengze.press;

    ssl_certificate /etc/letsencrypt/live/yengze.press/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yengze.press/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SmartWistonTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    location ~ ^/(api/v1(?:/|$)|health(?:/|$)) {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:13301;
    }

    location / {
        return 404;
    }

    access_log /www/wwwlogs/api.yengze.press.log;
    error_log /www/wwwlogs/api.yengze.press.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name img.yengze.press upload.yengze.press download.yengze.press;

    ssl_certificate /etc/letsencrypt/live/yengze.press/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yengze.press/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SmartWistonTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 1g;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_ssl_name yengze.press;
        proxy_ssl_server_name on;
        proxy_ssl_verify off;
        proxy_pass https://127.0.0.1:18445;
    }

    access_log /www/wwwlogs/objects.yengze.press.log;
    error_log /www/wwwlogs/objects.yengze.press.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name miniapp.yengze.press;

    ssl_certificate /opt/smart-wiston/shared/tls/origin.crt;
    ssl_certificate_key /opt/smart-wiston/shared/tls/origin.key;
    ssl_protocols TLSv1.3;
    ssl_session_cache shared:SmartWistonTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Cache-Control "no-store" always;

    return 404;

    access_log /www/wwwlogs/miniapp.yengze.press.log;
    error_log /www/wwwlogs/miniapp.yengze.press.error.log;
}
