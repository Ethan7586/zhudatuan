apiVersion: v1
kind: ServiceAccount
metadata:
  name: shop-migration
  namespace: SHOP_NAMESPACE
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: shop-migration-SHOP_RELEASE_ID
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-migration, shop.release/id: SHOP_RELEASE_ID }
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 604800
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-migration, shop.release/id: SHOP_RELEASE_ID }
    spec:
      restartPolicy: Never
      serviceAccountName: shop-migration
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: migration
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ['services/commerce/dist/MigrationMain.js']
          envFrom:
            - configMapRef: { name: shop-migration }
          env:
            - { name: TMPDIR, value: /tmp }
            - { name: MIGRATION_PHASE, value: SHOP_MIGRATION_PHASE }
            - name: SECRET_STORE_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: shop-migration-bootstrap, key: secretStoreBearerToken } }
            - name: KMS_BEARER_TOKEN
              valueFrom: { secretKeyRef: { name: shop-migration-bootstrap, key: kmsBearerToken } }
          resources:
            requests: { cpu: '1', memory: 1Gi }
            limits: { cpu: '4', memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
            - { name: migrationidentity, mountPath: /var/run/secrets/shop/identity, readOnly: true }
      volumes:
        - name: temporary
          emptyDir: { sizeLimit: 1Gi }
        - name: migrationidentity
          projected:
            defaultMode: 0400
            sources:
              - serviceAccountToken: { path: token, audience: shop-secret-manager, expirationSeconds: 1800 }
