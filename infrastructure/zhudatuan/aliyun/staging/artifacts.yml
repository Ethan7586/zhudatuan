version: 1
profile: full
state: inventory-only-not-provisioning-evidence
buildCommand: npm run build:commerce
digestPolicy: sha256-required-from-clean-release-before-copy

releaseArtifacts:
  - id: internalRuntime
    artifact: services/commerce/dist/InternalRuntimeMain.js
    source: tools/localinfra/src/Run.ts
    capability: secret-store-kms-and-object-store
  - id: internalRuntimeReadiness
    artifact: services/commerce/dist/InternalRuntimeReadyMain.js
    source: tools/localinfra/src/RegistrationReady.ts
  - id: internalSecretStore
    artifact: services/commerce/dist/LocalSecretsMain.js
    source: tools/localsecrets/src/Main.ts
  - id: internalKms
    artifact: services/commerce/dist/LocalKmsMain.js
    source: tools/localkms/src/Main.ts
  - id: internalObjectStore
    artifact: services/commerce/dist/LocalObjectsMain.js
    source: tools/localobjects/src/Main.ts
  - id: postgresTlsProxy
    artifact: services/commerce/dist/PostgresTlsProxyMain.js
    source: tools/localinfra/src/PostgresTlsProxyMain.ts
  - id: identityApi
    artifact: services/commerce/dist/IdentityRegistrationApiMain.js
    source: services/commerce/src/entry/IdentityRegistrationApiMain.ts
  - id: identityApiReadiness
    artifact: services/commerce/dist/IdentityRegistrationApiReadyMain.js
    source: services/commerce/src/entry/IdentityRegistrationApiReadyMain.ts
  - id: identityNotificationJobs
    artifact: services/commerce/dist/IdentityNotificationJobsOnlyMain.js
    source: services/commerce/src/entry/IdentityNotificationJobsOnlyMain.ts
  - id: identityNotificationJobsReadiness
    artifact: services/commerce/dist/IdentityNotificationJobsReadyMain.js
    source: services/commerce/src/entry/IdentityNotificationJobsReadyMain.ts
  - id: fullJobs
    artifact: services/commerce/dist/JobsMain.js
    source: services/commerce/src/entry/JobsMain.ts
    bundledImplementation: services/commerce/src/entry/FullJobsMain.ts
    requiredMarker: JOB_RUNTIME_CATALOG_DRIFT
  - id: migration
    artifact: services/commerce/dist/MigrationMain.js
    source: services/commerce/src/entry/MigrationMain.ts
  - id: stagingOwnerBootstrap
    artifact: services/commerce/dist/BootstrapStagingOwner.js
    source: tools/seed/src/BootstrapStagingOwner.ts
  - id: stagingReadiness
    artifact: services/commerce/dist/StagingReadinessMain.js
    source: infrastructure/zhudatuan/aliyun/staging/verify-readiness.mjs
    requiredMarker: example:validation-only
  - id: migrations
    artifact: database/supabase/migrations
    kind: immutable-directory
  - id: authWeb
    artifact: apps/auth-web/dist
    kind: static-directory
  - id: console
    artifact: apps/console/dist
    kind: static-directory

deploymentArtifacts:
  - infrastructure/zhudatuan/aliyun/postgres-init-registration.sh
  - infrastructure/zhudatuan/aliyun/postgres-reconcile-registration-boundary.sql
  - infrastructure/zhudatuan/aliyun/postgres-retire-registration-bootstrap.sql
  - infrastructure/zhudatuan/aliyun/staging/Caddyfile.full
  - infrastructure/zhudatuan/aliyun/staging/caddy-zhudatuan-staging-full.conf
  - infrastructure/zhudatuan/aliyun/staging/full-caddy.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-identity-registration-api.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-identity-notification-jobs.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-database-retire.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-jobs.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-internal-runtime.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-internal-access.bootstrap.example.json
  - infrastructure/zhudatuan/aliyun/staging/full-internal-access.example.json
  - infrastructure/zhudatuan/aliyun/staging/full-secrets.bootstrap.example.json
  - infrastructure/zhudatuan/aliyun/staging/full-secrets.example.json
  - infrastructure/zhudatuan/aliyun/staging/full-migration.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-owner-bootstrap.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-postgres-proxy.env.example
  - infrastructure/zhudatuan/aliyun/staging/full-rds-init.env.example
  - infrastructure/zhudatuan/aliyun/staging/prepare-internal-tls.mjs
  - infrastructure/zhudatuan/aliyun/staging/prepare-release.mjs
  - infrastructure/zhudatuan/aliyun/staging/validate-cost-approval.mjs
  - infrastructure/zhudatuan/aliyun/staging/install-caddy-candidate.sh
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-identity-api.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-identity-notification-jobs.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-database-retire.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-internal-runtime.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-jobs.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-migration.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-owner-bootstrap.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-postgres-proxy.service
  - infrastructure/zhudatuan/aliyun/staging/zhudatuan-staging-full-rds-init.service
  - infrastructure/zhudatuan/aliyun/staging/PREPARE.md
  - infrastructure/zhudatuan/aliyun/staging/STAGING-INFRASTRUCTURE-SPEC-20260829.md
  - infrastructure/zhudatuan/aliyun/staging/readiness.evidence.example.yml
  - infrastructure/zhudatuan/aliyun/staging/staging-cost-approval.example.yml

explicitExclusions:
  - artifact: services/commerce/dist/RegistrationMigrationMain.js
    reason: registration-only runner pins non-staging paths and references; full uses MigrationMain.js
  - artifact: services/commerce/dist/FullJobsMain.js
    reason: no standalone build artifact; FullJobsMain.ts is bundled into JobsMain.js
  - artifact: services/commerce/dist/BootstrapOwner.js
    reason: formal acceptance bootstrap is forbidden; full staging uses BootstrapStagingOwner.js
  - artifact: services/commerce/dist/BootstrapRegistration.js
    reason: authenticated Owner invitation API replaces static registration invitation bootstrap
