apiVersion: 01_core_hexin/apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-api, shop.release/id: SHOP_RELEASE_ID }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    type: RollingUpdate
  selector:
    matchLabels: { app.kubernetes.io/name: shop-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-api, shop.release/id: SHOP_RELEASE_ID }
    spec:
      serviceAccountName: shop-runtime
      terminationGracePeriodSeconds: 45
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-api }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-api }
      containers:
        - name: api
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["01_core_hexin/services/commerce/dist/ApiMain.js"]
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: shop-api }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  selector: { app.kubernetes.io/name: shop-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: shop-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  scaleTargetRef: { apiVersion: 01_core_hexin/apps/v1, kind: Deployment, name: shop-api }
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: 01_core_hexin/apps/v1
kind: Deployment
metadata:
  name: shop-jobs
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-jobs, shop.release/id: SHOP_RELEASE_ID }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: shop-jobs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-jobs, shop.release/id: SHOP_RELEASE_ID }
    spec:
      serviceAccountName: shop-runtime
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-jobs }
      containers:
        - name: jobs
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["01_core_hexin/services/commerce/dist/JobsMain.js"]
          envFrom:
            - configMapRef: { name: shop-jobs }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-jobs
  namespace: SHOP_NAMESPACE
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: shop-jobs }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-runtime
  namespace: SHOP_NAMESPACE
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [shop-api, shop-jobs] }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-system }
      ports: [{ protocol: TCP, port: 3001 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: platform-services }
      ports:
        - { protocol: TCP, port: 443 }
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
