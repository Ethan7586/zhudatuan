version: 1
owner: security
store: managed-secret-store
kms: managed-kms
valuesInRepository: forbidden
referencePattern: '^[a-z][a-z0-9./-]{2,255}$'
defaults:
  environments: [development, staging, production]
  versioned: true
  leaseMinutes: 60
  rotationDays: 90
  previousVersionOverlapHours: 24
  auditReads: true
  emergencyRevocationMinutes: 15
catalog:
  - { id: database-api, owner: platform, purpose: API database role, readers: [api], rotationDays: 30, revoke: rotate-and-terminate-api-pools }
  - { id: database-jobs, owner: platform, purpose: Jobs database role, readers: [jobs], rotationDays: 30, revoke: rotate-and-terminate-job-pools }
  - { id: database-provider, owner: platform, purpose: Provider database role, readers: [provider], rotationDays: 30, revoke: rotate-and-terminate-provider-pools }
  - { id: database-migration, owner: database, purpose: approved migration session, readers: [migration], rotation: per-release, revoke: disable-migration-identity }
  - { id: redis-runtime, owner: platform, purpose: cache and durable stream transport, readers: [api, jobs, provider], rotationDays: 30, revoke: rotate-and-reconnect }
  - { id: identity-session, owner: identity, purpose: session signing, readers: [api], rotationDays: 30, revoke: rotate-and-revoke-token-families }
  - { id: identity-index, owner: identity, purpose: identity tokenization pepper, readers: [api, jobs], rotationDays: 90, revoke: isolate-and-reindex }
  - { id: identity-invitation, owner: identity, purpose: invitation signing, readers: [api, jobs], rotationDays: 30, revoke: rotate-and-expire-outstanding }
  - { id: navigation-hmac, owner: navigation, purpose: navigation snapshot signing, readers: [api], rotationDays: 90, revoke: rotate-and-invalidate-snapshots }
  - { id: checkout-quote, owner: checkout, purpose: quote confirmation signing, readers: [api], rotationDays: 30, revoke: rotate-and-expire-quotes }
  - { id: pii-envelope, owner: security, purpose: restricted field envelope encryption, readers: [api, jobs, migration], rotationDays: 90, revoke: disable-writes-and-rewrap }
  - { id: object-api, owner: runtime, purpose: object service authorization, readers: [api, jobs], rotationDays: 30, revoke: rotate-and-expire-signed-urls }
  - { id: extension-manifest-public, owner: extension, purpose: extension signature verification, readers: [api, jobs, provider], rotationDays: 180, revoke: disable-affected-extensions }
  - { id: extension-manifest-private, owner: extension, purpose: extension signing, readers: [release], rotationDays: 180, revoke: rotate-resign-and-disable-old-key }
  - { id: provider-credential, owner: channel, purpose: provider request authentication, readers: [provider], scope: connection, rotation: provider-policy, revoke: disable-connection-drain-and-rotate }
  - { id: wechat-application, owner: identity, purpose: WeChat identity applications, readers: [api], rotationDays: 90, revoke: disable-provider-and-rotate }
  - { id: wechat-payment, owner: payment, purpose: payment signing and callback decryption, readers: [api, provider], rotation: provider-policy, revoke: stop-new-intents-query-unknown-and-rotate }
  - { id: invoice-provider, owner: invoice, purpose: invoice provider authentication, readers: [provider], rotationDays: 90, revoke: pause-issuance-and-rotate }
  - { id: payout-provider, owner: finance, purpose: payout provider authentication, readers: [provider], rotationDays: 90, revoke: pause-payouts-and-rotate }
  - { id: notification-provider, owner: notification, purpose: email SMS and WeChat credentials, readers: [provider], rotationDays: 90, revoke: isolate-channel-and-rotate }
controls:
  creation: maker-checker
  plaintextRead: forbidden-after-write
  browserAccess: forbidden
  logAccess: forbidden
  databaseStorage: version-reference-only
  workloadAuthentication: oidc
  leaseAudience: exact-workload
  leaseScope: exact-secret-version
  breakglass: { approval: security-incident-commander, ttlMinutes: 30, recording: required, postReview: required }
