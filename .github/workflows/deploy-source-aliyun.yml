name: Deploy Sealed Source 1.5 - Reusable
run-name: Deploy sealed source 1.5 ${{ inputs.head_sha }}

# This explicit deployment consumes the successful post-merge closure manifest. It never
# prepares artifacts, builds code, edits configuration, or discovers a new deployment scope.
on:
  workflow_call:
    inputs:
      head_sha:
        description: Exact zdt-next source SHA whose automatic closure completed successfully
        required: true
        type: string
    secrets:
      ZDT_RUNNER_READ_TOKEN:
        required: true
      ZDT_RELEASE_SSH_KEY:
        required: true
      ALIYUN_OSS_ACCESS_KEY_ID:
        required: true
      ALIYUN_OSS_ACCESS_KEY_SECRET:
        required: true
      ALIYUN_OSS_SECURITY_TOKEN:
        required: false
      ALIYUN_OSS_BUCKET:
        required: true
      ALIYUN_OSS_ENDPOINT:
        required: true
      ALIYUN_OSS_INTERNAL_ENDPOINT:
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: zdt-next-deploy-source-${{ inputs.head_sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Read successful sealed-source manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      migrations: ${{ steps.closure.outputs.migrations }}
      runtimes: ${{ steps.closure.outputs.runtimes }}
      frontends: ${{ steps.closure.outputs.frontends }}
      has_migrations: ${{ steps.closure.outputs.has_migrations }}
      has_runtimes: ${{ steps.closure.outputs.has_runtimes }}
      has_frontends: ${{ steps.closure.outputs.has_frontends }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Load orchestration dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Resolve exact successful automatic closure
        id: closure
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'head_sha must be one full lowercase Git SHA' >&2; exit 64; }
          runs="$RUNNER_TEMP/automatic-closure-runs.json"
          gh run list --repo "$GITHUB_REPOSITORY" --workflow auto-prepare-artifacts.yml --branch zdt-next --limit 100 \
            --json databaseId,headSha,event,status,conclusion,url,createdAt > "$runs"
          run_id=''
          closure_dir=''
          while read -r candidate_id; do
            [ -n "$candidate_id" ] || continue
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate_id}/artifacts" \
              --jq ".artifacts[] | select(.name == \"automatic-artifact-closure-${SOURCE_SHA}\") | .id" | head -1)"
            [ -n "$artifact_id" ] || continue
            candidate_dir="$RUNNER_TEMP/automatic-closure-$candidate_id"
            mkdir -p "$candidate_dir"
            gh run download "$candidate_id" --repo "$GITHUB_REPOSITORY" --name "automatic-artifact-closure-$SOURCE_SHA" --dir "$candidate_dir"
            if CLOSURE="$candidate_dir/closure.json" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { verifyProductionClosureManifest } from './04_tools/release-engine/src/production-orchestrator.mjs';
          verifyProductionClosureManifest(JSON.parse(readFileSync(process.env.CLOSURE, 'utf8')), process.env.SOURCE_SHA);
          NODE
            then run_id="$candidate_id"; closure_dir="$candidate_dir"; break; fi
          done < <(node -e "const r=require(process.argv[1]);const s=process.env.SOURCE_SHA;for(const v of r)if(v.status==='completed'&&v.conclusion==='success'&&(v.headSha===s||v.event==='workflow_dispatch'))console.log(v.databaseId)" "$runs")
          [ -n "$run_id" ] || { echo "No successful finalized v2 closure exists for $SOURCE_SHA" >&2; exit 1; }
          CLOSURE="$closure_dir/closure.json" GITHUB_OUTPUT="$GITHUB_OUTPUT" node <<'NODE'
          const fs = require('node:fs');
          const closure = JSON.parse(fs.readFileSync(process.env.CLOSURE, 'utf8'));
          const names = ['migrations', 'runtimes', 'frontends'];
          let count = 0;
          for (const name of names) {
            const entries = closure.waves?.[name];
            if (!Array.isArray(entries)) throw new Error(`Automatic closure wave is missing: ${name}`);
            for (const entry of entries) {
              if (!/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(entry.target ?? '') || !/^[A-Za-z0-9][A-Za-z0-9_.-]*$/.test(entry.node ?? '')) {
                throw new Error(`Automatic closure contains an invalid ${name} placement`);
              }
            }
            count += entries.length;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${JSON.stringify({ include: entries })}\n`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_${name}=${entries.length > 0}\n`);
          }
          if (count === 0) {
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `No production target changed in source ${process.env.SOURCE_SHA}; deployment completed as a no-op.\n`);
          }
          NODE

  migrations:
    name: Deploy migration ${{ matrix.target }} → ${{ matrix.node }}
    needs: resolve
    if: needs.resolve.outputs.has_migrations == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.migrations) }}
    uses: ./.github/workflows/deploy-prepared-aliyun.yml
    with:
      auth_mode: static-access-key
      role_kind: releaser
      head_sha: ${{ inputs.head_sha }}
      release_target: ${{ matrix.target }}
      release_node: ${{ matrix.node }}
      operation: deploy
      seal_control_sha: ${{ matrix.seal_control_sha }}
      seal_artifact_digest: ${{ matrix.artifact_digest }}
      seal_key: ${{ matrix.seal_key }}
      seal_receipt_object: ${{ matrix.final_seal_receipt_object }}
      seal_digest: ${{ matrix.final_seal_digest }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}

  runtimes:
    name: Deploy runtime ${{ matrix.target }} → ${{ matrix.node }}
    needs: [resolve, migrations]
    if: ${{ always() && needs.resolve.outputs.has_runtimes == 'true' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.runtimes) }}
    uses: ./.github/workflows/deploy-prepared-aliyun.yml
    with:
      auth_mode: static-access-key
      role_kind: releaser
      head_sha: ${{ inputs.head_sha }}
      release_target: ${{ matrix.target }}
      release_node: ${{ matrix.node }}
      operation: deploy
      seal_control_sha: ${{ matrix.seal_control_sha }}
      seal_artifact_digest: ${{ matrix.artifact_digest }}
      seal_key: ${{ matrix.seal_key }}
      seal_receipt_object: ${{ matrix.final_seal_receipt_object }}
      seal_digest: ${{ matrix.final_seal_digest }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}

  frontends:
    name: Deploy frontend ${{ matrix.target }} → ${{ matrix.node }}
    needs: [resolve, migrations, runtimes]
    if: ${{ always() && needs.resolve.outputs.has_frontends == 'true' && (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') && (needs.runtimes.result == 'success' || needs.runtimes.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.frontends) }}
    uses: ./.github/workflows/deploy-prepared-aliyun.yml
    with:
      auth_mode: static-access-key
      role_kind: releaser
      head_sha: ${{ inputs.head_sha }}
      release_target: ${{ matrix.target }}
      release_node: ${{ matrix.node }}
      operation: deploy
      seal_control_sha: ${{ matrix.seal_control_sha }}
      seal_artifact_digest: ${{ matrix.artifact_digest }}
      seal_key: ${{ matrix.seal_key }}
      seal_receipt_object: ${{ matrix.final_seal_receipt_object }}
      seal_digest: ${{ matrix.final_seal_digest }}
    secrets:
      ZDT_RUNNER_READ_TOKEN: ${{ secrets.ZDT_RUNNER_READ_TOKEN }}
      ZDT_RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
      ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
      ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
      ALIYUN_OSS_SECURITY_TOKEN: ${{ secrets.ALIYUN_OSS_SECURITY_TOKEN }}
      ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
      ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
      ALIYUN_OSS_INTERNAL_ENDPOINT: ${{ secrets.ALIYUN_OSS_INTERNAL_ENDPOINT }}
