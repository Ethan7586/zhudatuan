apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-api, shop.release/id: SHOP_RELEASE_ID }
spec:
  replicas: 3
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    type: RollingUpdate
  selector:
    matchLabels: { app.kubernetes.io/name: shop-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-api, shop.release/id: SHOP_RELEASE_ID }
    spec:
      serviceAccountName: shop-api
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-api }
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-api }
      containers:
        - name: api
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ['services/commerce/dist/ApiMain.js']
          ports: [{ name: http, containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: shop-api }
          env:
            - { name: TMPDIR, value: /tmp }
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            failureThreshold: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            failureThreshold: 3
            periodSeconds: 10
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: '2', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: { sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  selector: { app.kubernetes.io/name: shop-api }
  ports: [{ name: http, port: 80, targetPort: http }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  minAvailable: 2
  selector:
    matchLabels: { app.kubernetes.io/name: shop-api }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-api
  namespace: SHOP_NAMESPACE
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shop-api }
  minReplicas: 3
  maxReplicas: 20
  behavior:
    scaleDown: { stabilizationWindowSeconds: 300 }
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-jobs
  namespace: SHOP_NAMESPACE
  labels: { app.kubernetes.io/name: shop-jobs, shop.release/id: SHOP_RELEASE_ID }
spec:
  replicas: 2
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels: { app.kubernetes.io/name: shop-jobs }
  template:
    metadata:
      labels: { app.kubernetes.io/name: shop-jobs, shop.release/id: SHOP_RELEASE_ID }
    spec:
      serviceAccountName: shop-jobs
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: shop-jobs }
      containers:
        - name: jobs
          image: SHOP_COMMERCE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ['services/commerce/dist/JobsMain.js']
          envFrom:
            - configMapRef: { name: shop-jobs }
          env:
            - { name: TMPDIR, value: /tmp }
            - { name: WORKER_READY_FILE, value: /tmp/worker-ready }
          startupProbe:
            exec: { command: ['test', '-f', '/tmp/worker-ready'] }
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec: { command: ['test', '-f', '/tmp/worker-ready'] }
            failureThreshold: 2
            periodSeconds: 5
          livenessProbe:
            exec: { command: ['node', '-e', 'process.kill(1,0)'] }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: '2', memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: temporary, mountPath: /tmp }
      volumes:
        - name: temporary
          emptyDir: { sizeLimit: 512Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-jobs
  namespace: SHOP_NAMESPACE
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: shop-jobs }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-jobs
  namespace: SHOP_NAMESPACE
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shop-jobs }
  minReplicas: 2
  maxReplicas: 20
  behavior:
    scaleUp: { stabilizationWindowSeconds: 30, policies: [{ type: Percent, value: 100, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 300, policies: [{ type: Percent, value: 25, periodSeconds: 60 }] }
  metrics:
    - type: External
      external:
        metric: { name: shop_job_queue_depth }
        target: { type: AverageValue, averageValue: '100' }
    - type: External
      external:
        metric: { name: shop_job_oldest_message_seconds }
        target: { type: AverageValue, averageValue: '30' }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shop-api, namespace: SHOP_NAMESPACE }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: shop-jobs, namespace: SHOP_NAMESPACE }
automountServiceAccountToken: false
