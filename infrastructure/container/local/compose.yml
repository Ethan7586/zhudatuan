name: ${LOCAL_COMPOSE_PROJECT}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgresadmin
      SHOPAPP_PASSWORD_FILE: /run/secrets/postgresapi
      SHOPJOB_PASSWORD_FILE: /run/secrets/postgresjobs
      SHOPPROVIDER_PASSWORD_FILE: /run/secrets/postgresprovider
    secrets: [postgresadmin, postgresapi, postgresjobs, postgresprovider]
    ports:
      - '127.0.0.1:${LOCAL_POSTGRES_PORT}:5432'
    volumes:
      - postgresdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-ec']
    command: ['exec redis-server --appendonly yes --requirepass "$$(cat /run/secrets/redis)"']
    secrets: [redis]
    ports:
      - '127.0.0.1:${LOCAL_REDIS_PORT}:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$(cat /run/secrets/redis)" --no-auth-warning ping | grep -qx PONG']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 3s

  objects:
    profiles: [objects]
    build:
      context: ../../..
      dockerfile: infrastructure/container/Dockerfile
      target: build
    command: ['node', '--import', 'tsx', 'tools/localobjects/src/Main.ts']
    environment:
      LOCAL_TLS_KEY_FILE: /workspace/infrastructure/container/local/.tls/local.key
      LOCAL_TLS_CERT_FILE: /workspace/infrastructure/container/local/.tls/local.crt
      LOCAL_OBJECTS_PORT: '8445'
      LOCAL_OBJECTS_DIRECTORY: /workspace/infrastructure/container/local/data/objects
      LOCAL_OBJECTS_TOKEN_FILE: /run/secrets/objects
    entrypoint: ['/bin/sh', '-ec', 'export LOCAL_OBJECTS_TOKEN="$$(cat /run/secrets/objects)"; exec "$$@"', '--']
    secrets: [objects]
    ports: ['127.0.0.1:8445:8445']
    volumes:
      - ./.tls:/workspace/infrastructure/container/local/.tls:ro
      - ./data/objects:/workspace/infrastructure/container/local/data/objects
    read_only: true
    tmpfs: [/tmp]

  providersandbox:
    profiles: [provider]
    build:
      context: ../../..
      dockerfile: infrastructure/container/Dockerfile
      target: build
    command: ['node', '--import', 'tsx', 'tools/localinfra/src/ProviderSandbox.ts']
    environment: { LOCAL_PROVIDER_PORT: '9080' }
    ports: ['127.0.0.1:9080:9080']
    read_only: true
    tmpfs: [/tmp]

volumes:
  postgresdata:
  redisdata:

secrets:
  postgresadmin: { file: ./data/secrets/postgresadmin }
  postgresapi: { file: ./data/secrets/postgresapi }
  postgresjobs: { file: ./data/secrets/postgresjobs }
  postgresprovider: { file: ./data/secrets/postgresprovider }
  redis: { file: ./data/secrets/redis }
  objects: { file: ./data/secrets/objects }
