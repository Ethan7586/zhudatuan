version: 3
owner: identity
schema:
  provider:
    required: [id, type, issuer, audiences, clientId, secretRef, keyVersion, enabled]
    issuer: httpsurl
    audiences: nonemptyunique
    clientId: publicidentifier
    secretRef: secretreference
    keyVersion: positiveinteger
  wechatapplication:
    required: [scene, appId, secretRef, keyVersion]
    scenes: [miniapp, jsapi]
    appId: wechatapplicationid
    secretRef: secretreference
    keyVersion: positiveinteger
types:
  oidc:
    timeoutMilliseconds: 5000
    circuitFailureThreshold: 5
    circuitRecoveryMilliseconds: 30000
  wechat:
    timeoutMilliseconds: 5000
    circuitFailureThreshold: 5
    circuitRecoveryMilliseconds: 30000
  wecomcorp:
    timeoutMilliseconds: 5000
    circuitFailureThreshold: 5
    circuitRecoveryMilliseconds: 30000
  wecomsuite:
    timeoutMilliseconds: 5000
    circuitFailureThreshold: 5
    circuitRecoveryMilliseconds: 30000
security:
  discoveryPath: /.well-known/openid-configuration
  discoveryTtlSeconds: 3600
  jwksTtlSeconds: 900
  clockSkewSeconds: 60
  transactionTtlSeconds: 300
  ticketTtlSeconds: 60
  preauthTtlSeconds: 300
  pkce: S256
  stateBytes: 32
  nonceBytes: 32
  maximumProviders: 64
  maximumScopes: 32
  maximumResponseBytes: 1048576
  retryAttempts: 3
  allowedAlgorithms: [RS256, ES256]
  issuerPolicy: exact-configured-https-origin
  audiencePolicy: exact-nonempty-configured-set
  authorizationResponseMode: query
  tokenEndpointAuthentication: client-secret-from-secret-store
  redirectMatch: exact-origin-and-path
  secretReference: ^[a-z][a-z0-9./]{2,127}$
  redirectAllowlist: [https://passport.yengze.press]
  bindingConflict: reject
  accountLink: explicitproof
  linkConflict: reject-and-audit
  subjectReassignment: forbidden
  keyRotationOverlapHours: 24
  staleKeyFailure: failclosed
  keyRotationDays: 90
