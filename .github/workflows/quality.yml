name: Affected Delivery

on:
  pull_request:
    branches: [zdt-next]
  push:
    branches: [zdt-next]
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional immutable base SHA for candidate validation
        required: false
        type: string
      head_sha:
        description: Optional immutable head SHA for candidate validation
        required: false
        type: string
      stage_candidate:
        description: Stage the validated candidate on Aliyun without production cutover
        required: false
        default: false
        type: boolean
      force_runtime_rebuild:
        description: Rebuild every current runtime artifact from the selected commit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: zdt-next-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/zdt-next' }}

env:
  NODE_VERSION: 22.22.0

jobs:
  plan:
    name: plan affected scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deploy_required: ${{ steps.plan.outputs.deploy_required }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      lane: ${{ steps.plan.outputs.lane }}
      run_id: ${{ steps.plan.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.head_sha || github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install release plan dependency
        run: |
          started_at="$(date +%s)"
          npm install --prefix 04_tools/release-engine esbuild@0.28.1 --no-save --package-lock=false --ignore-scripts --no-audit --no-fund
          elapsed_seconds="$(( $(date +%s) - started_at ))"
          printf 'Minimal esbuild install: %ss\n' "$elapsed_seconds" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Resolve immutable base and head
        id: refs
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          if [ -n "$INPUT_HEAD_SHA" ]; then
            base_sha="$INPUT_BASE_SHA"
            head_sha="$INPUT_HEAD_SHA"
            if [ -z "$base_sha" ]; then
              base_sha="$(git rev-parse "$head_sha^")"
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            head_sha="$PUSH_HEAD_SHA"
            base_sha="$PUSH_BASE_SHA"
            if [ -z "$base_sha" ] || [ "$base_sha" = "0000000000000000000000000000000000000000" ]; then
              base_sha="$(git rev-parse "$head_sha^")"
            fi
          fi
          git cat-file -e "$base_sha^{commit}"
          git cat-file -e "$head_sha^{commit}"
          printf 'base_sha=%s\nhead_sha=%s\n' "$base_sha" "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Create authoritative release plan
        id: plan
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
          FORCE_RUNTIME_REBUILD: ${{ inputs.force_runtime_rebuild }}
        run: |
          mkdir -p .ci-release
          force_files=()
          if [ "$FORCE_RUNTIME_REBUILD" = "true" ]; then
            force_files+=(
              --file 01_core_hexin/apps/storefront-web/src/StorefrontRoot.tsx
              --file 01_core_hexin/apps/auth-web/src/main.tsx
              --file 01_core_hexin/apps/console/src/main.tsx
              --file 01_core_hexin/services/commerce/src/entry/IdentityRegistrationApiMain.ts
              --file 01_core_hexin/services/commerce/src/entry/IdentityNotificationJobsOnlyMain.ts
              --file 01_core_hexin/services/commerce/src/entry/ConsoleSupportMain.ts
              --file 01_core_hexin/services/commerce/src/entry/PurchaseApiMain.ts
              --file 01_core_hexin/services/commerce/src/entry/WebBusinessApiMain.ts
              --file 01_core_hexin/services/commerce/src/entry/CatalogOperatorApiMain.ts
              --file 01_core_hexin/services/commerce/src/entry/CatalogJobsMain.ts
              --file 01_core_hexin/services/commerce/src/entry/PaymentWebhookApiMain.ts
              --file 01_core_hexin/services/commerce/src/entry/PaymentJobsMain.ts
            )
          fi
          node 04_tools/release-engine/cli.mjs plan \
            --from "$BASE_SHA" \
            --to "$HEAD_SHA" \
            --node hbbtzn-l1 \
            --node zhudatuan-l0 \
            "${force_files[@]}" \
            --format json > .ci-release/plan-envelope.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { digest } from './04_tools/release-engine/src/stable.mjs';
          const envelope = JSON.parse(readFileSync('.ci-release/plan-envelope.json', 'utf8'));
          if (!envelope.ok) throw new Error('release plan failed');
          const plan = envelope.result;
          const stablePlan = { ...plan };
          delete stablePlan.generatedAt;
          delete stablePlan.planDigest;
          delete stablePlan.planPath;
          delete stablePlan.runId;
          delete stablePlan.timings;
          plan.planDigest = digest(stablePlan);
          writeFileSync('.ci-release/plan.json', `${JSON.stringify(plan, null, 2)}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, [
            `deploy_required=${plan.deployRequired}`,
            `head_sha=${plan.to.sha}`,
            `lane=${plan.lane}`,
            `run_id=${plan.runId}`,
            '',
          ].join('\n'));
          NODE

      - name: Publish machine-readable plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}
          path: .ci-release/plan.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Test affected-delivery planning changes
        env:
          BASE_SHA: ${{ steps.refs.outputs.base_sha }}
          HEAD_SHA: ${{ steps.refs.outputs.head_sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- \
            .github/workflows/quality.yml \
            04_tools/release-engine \
            02_platform_pingtai/infrastructure/release/zdt-next.release.json | grep -q .; then
            node --test 04_tools/release-engine/test/planner.test.mjs
          fi

  affected_candidate:
    name: affected tests, typecheck, build, package and candidate
    needs: plan
    if: needs.plan.outputs.deploy_required == 'true' && needs.plan.outputs.lane != 'A3'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ZDT_RELEASE_SSH_HOST: root@123.57.232.253
      VITE_API_BASE_URL: https://api.hbbtzn.com
      VITE_AUTH_BASE_URL: https://accounts.hbbtzn.com
      VITE_CLIENT_VERSION: 0.0.0-g${{ needs.plan.outputs.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Configure candidate-only SSH transport
        if: (github.event_name == 'push' && github.ref == 'refs/heads/zdt-next') || (github.event_name == 'workflow_dispatch' && inputs.stage_candidate)
        env:
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
        run: |
          test -n "$RELEASE_SSH_KEY"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 123.57.232.253 >> "$HOME/.ssh/known_hosts"

      - name: Install matching delivery agent and policy on Aliyun
        if: (github.event_name == 'push' && github.ref == 'refs/heads/zdt-next') || (github.event_name == 'workflow_dispatch' && inputs.stage_candidate)
        env:
          SOURCE_SHA: ${{ needs.plan.outputs.head_sha }}
        run: |
          node 04_tools/release-engine/cli.mjs install \
            --mode agent \
            --source-sha "$SOURCE_SHA" \
            --approve-install "zdt-next:install:$SOURCE_SHA" \
            --format json > "$RUNNER_TEMP/install-agent.json"
          mkdir -p .ci-release
          mv "$RUNNER_TEMP/install-agent.json" .ci-release/install-agent.json

      - name: Restore authoritative plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}
          path: .ci-release

      - name: Restore immutable artifact cache
        uses: actions/cache@v4
        with:
          path: .ai-delivery/artifacts
          key: delivery-artifacts-v4-${{ runner.os }}-${{ needs.plan.outputs.head_sha }}

      - name: Restore dependencies for affected targets
        if: needs.plan.outputs.lane != 'A0'
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run affected tests, typecheck and build once
        run: |
          node 04_tools/release-engine/cli.mjs build \
            --plan .ci-release/plan.json \
            --format json > .ci-release/build-envelope.json

      - name: Package immutable target artifacts
        run: |
          node 04_tools/release-engine/cli.mjs package \
            --build .ci-release/build.json \
            --format json > .ci-release/package-envelope.json

      - name: Publish immutable candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ needs.plan.outputs.head_sha }}
          path: |
            .ci-release/plan.json
            .ci-release/build.json
            .ci-release/package.json
            .ai-delivery/artifacts/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Stage candidate on Aliyun without production cutover
        if: (github.event_name == 'push' && github.ref == 'refs/heads/zdt-next') || (github.event_name == 'workflow_dispatch' && inputs.stage_candidate)
        run: |
          node 04_tools/release-engine/cli.mjs deploy \
            --package .ci-release/package.json \
            --node hbbtzn-l1 \
            --node zhudatuan-l0 \
            --environment candidate \
            --format json > .ci-release/deploy-candidate.json

      - name: Publish candidate timing evidence
        if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/zdt-next') || (github.event_name == 'workflow_dispatch' && inputs.stage_candidate))
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-evidence-${{ needs.plan.outputs.head_sha }}
          path: |
            .ci-release/install-agent.json
            .ci-release/deploy-candidate.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

      - name: Ensure release produced no source drift
        run: git diff --exit-code

  # full_a3 job 已于 2026-09-11 移除（前身 commit 5967e66e）。
  # 原因：planner 误判 src/entry/* → fail-closed A3、A3 无单服务 target、每轮约 40 分钟。
  # 重装：从 git history 取回 full_a3 定义，并先做 planner 规则 + 增量缓存 + 单服务 target。

  no_changes:
    name: no deployable changes
    needs: plan
    if: needs.plan.outputs.deploy_required != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Plan completed; no tests, build, package, upload or restart required."
