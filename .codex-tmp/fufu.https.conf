server {
    listen 80;
    server_name fufu.wang accounts.fufu.wang console.fufu.wang api.fufu.wang;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/fufu-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name fufu.wang;
    root /opt/smart-wiston/current/apps/storefront/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fufu.wang/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fufu.wang/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FufuSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ~ /\. { deny all; }
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }

    access_log /www/wwwlogs/fufu.wang.log;
    error_log /www/wwwlogs/fufu.wang.error.log;
}

