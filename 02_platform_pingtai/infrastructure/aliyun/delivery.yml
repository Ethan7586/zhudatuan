version: 1
owner: platform
edge:
  waf: aliyun
  cdn: aliyun
  apiOrigin: alb
  staticOrigin: oss
routes:
  api:
    host: api.fufuwang.com.cn
    service: shop-api
    paths: [/api/v1, /health]
  storefront: { host: fufuwang.com.cn, artifact: storefront }
  auth: { host: auth.fufuwang.com.cn, artifact: auth }
  console: { host: console.fufuwang.com.cn, artifact: console }
  store: { host: store.fufuwang.com.cn, artifact: store }
  supplier: { host: supplier.fufuwang.com.cn, artifact: supplier }
  miniapp: { appid: wx4df4137881a1d2bc, artifact: miniapp }
release:
  staticPrefix: releases/{releaseId}/{client}
  pointer: releases/current.json
  immutableCache: public,max-age=31536000,immutable
  pointerCache: no-store
  canaryPercent: [5, 25, 50, 100]
