name: Deploy
run-name: Deploy ${{ inputs.head_sha }} ${{ inputs.release_node }} ${{ inputs.release_target }}

# Direct production delivery. This workflow builds the requested runtime target and
# sends it straight from GitHub to Aliyun in one job. Quality workflows are separate
# tools and are never prerequisites for this workflow.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact 40-character zdt-next commit to deploy
        required: true
        type: string
      release_target:
        description: One runtime target
        required: true
        type: choice
        options:
          - h6-cdn
          - catalog-media
          - storefront
          - auth-web
          - console
          - identity-api
          - identity-notification-jobs
          - mall-provisioning-api
          - support-api
          - purchase-api
          - web-api
          - catalog-api
          - catalog-jobs
          - payment-webhook-api
          - payment-jobs
          - database-migration
      release_node:
        description: Sovereign node
        required: true
        type: choice
        options:
          - hbbtzn-l1
          - zhudatuan-l0

permissions:
  contents: read

concurrency:
  group: zdt-next-direct-${{ inputs.release_node }}-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  RELEASE_SHA: ${{ inputs.head_sha }}
  RELEASE_NODE: ${{ inputs.release_node }}
  RELEASE_TARGET: ${{ inputs.release_target }}
  ZDT_RELEASE_SSH_HOST: root@123.57.232.253
  VITE_API_BASE_URL: https://api.hbbtzn.com
  VITE_AUTH_BASE_URL: https://accounts.hbbtzn.com
  VITE_ZHUDIAN_SOLUTION_ORIGIN: https://labs.hbbtzn.com
  VITE_CLIENT_VERSION: 0.0.0-g${{ inputs.head_sha }}

jobs:
  deploy:
    name: GitHub → Aliyun ${{ inputs.release_node }}/${{ inputs.release_target }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Validate exact single-target request
        shell: bash
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "head_sha must be one full lowercase Git commit SHA" >&2
            exit 64
          fi
          if [[ -z "$RELEASE_NODE" || -z "$RELEASE_TARGET" ]]; then
            echo "release_node and release_target are required" >&2
            exit 64
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ inputs.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Resolve exact version and direct plan
        id: release
        run: |
          sha="$(git rev-parse HEAD)"
          if [ "$sha" != "$RELEASE_SHA" ]; then
            echo "checked out commit does not match head_sha" >&2
            exit 1
          fi
          if [ "$RELEASE_TARGET" = "h6-cdn" ]; then
            printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
            printf 'Direct edge version: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="$(git rev-parse HEAD^)"
          mkdir -p .direct-release
          node 04_tools/release-engine/cli.mjs plan \
            --from "$base" \
            --to "$sha" \
            --node "$RELEASE_NODE" \
            --target "$RELEASE_TARGET" \
            --direct \
            --format json > .direct-release/plan-envelope.json
          plan_path="$(node -e "const r=require('./.direct-release/plan-envelope.json');if(!r.ok||!r.result.deployRequired)throw new Error('No deployable target for this version');process.stdout.write(r.result.planPath)")"
          printf 'sha=%s\nplan_path=%s\n' "$sha" "$plan_path" >> "$GITHUB_OUTPUT"
          printf 'Direct version: `%s`\n' "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Aliyun runtime transport
        if: env.RELEASE_TARGET != 'h6-cdn'
        env:
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 123.57.232.253 >> "$HOME/.ssh/known_hosts"

      - name: Build, transfer and switch production
        if: env.RELEASE_TARGET != 'h6-cdn'
        env:
          PLAN_PATH: ${{ steps.release.outputs.plan_path }}
        run: |
          node 04_tools/release-engine/cli.mjs build --plan "$PLAN_PATH" --format json > .direct-release/build-envelope.json
          build_path="$(node -e "const r=require('./.direct-release/build-envelope.json');if(!r.ok)throw new Error('Build failed');process.stdout.write(r.result.buildPath)")"
          node 04_tools/release-engine/cli.mjs package --build "$build_path" --format json > .direct-release/package-envelope.json
          package_path="$(node -e "const r=require('./.direct-release/package-envelope.json');if(!r.ok)throw new Error('Package failed');process.stdout.write(r.result.packagePath)")"
          node 04_tools/release-engine/cli.mjs deploy \
            --package "$package_path" \
            --node "$RELEASE_NODE" \
            --target "$RELEASE_TARGET" \
            --environment production \
            --direct \
            --format json | tee .direct-release/deploy-envelope.json
          node -e "const r=require('./.direct-release/deploy-envelope.json');const x=r.result;if(!r.ok||x.finalStatus!=='success')process.exit(1);console.log('Direct deployment: '+x.sourceSha+' '+x.finalStatus);" >> "$GITHUB_STEP_SUMMARY"

      - name: Switch H6 Alibaba Cloud CDN route
        if: env.RELEASE_TARGET == 'h6-cdn'
        env:
          ALIYUN_CDN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_CDN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node 04_tools/release-engine/cli.mjs channel \
            --target "$RELEASE_TARGET" \
            --node "$RELEASE_NODE" \
            --action deploy \
            --source-sha "$RELEASE_SHA" \
            --format json | tee .direct-release/channel-envelope.json
          node -e "const r=require('./.direct-release/channel-envelope.json');const x=r.result;if(!r.ok||x.finalStatus!=='success')process.exit(1);console.log('H6 edge route: '+x.sourceSha+' '+x.after.route);" >> "$GITHUB_STEP_SUMMARY"
