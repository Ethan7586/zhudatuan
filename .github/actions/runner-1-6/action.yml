name: Runner 1.7 shared release core
description: Runs the same release implementation on Aliyun or GitHub Hosted runners
inputs:
  operation:
    required: true
  identifier:
    required: false
    default: ''
  source-sha:
    required: false
    default: ''
  target:
    required: false
    default: ''
  physical-node:
    required: false
    default: ''
  runner-class:
    required: true
  control-root:
    required: false
    default: ''
outputs:
  started:
    description: True once the shared release core is about to execute
    value: ${{ steps.started.outputs.value }}
runs:
  using: composite
  steps:
    - name: Use Node 22
      uses: actions/setup-node@v6
      with:
        node-version: 22.22.0
    - name: Select exact Source checkout paths
      id: source_scope
      if: inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry')
      shell: bash
      env:
        CONTROL_ROOT: ${{ inputs.control-root != '' && inputs.control-root || github.workspace }}
        RELEASE_TARGET: ${{ inputs.target }}
      run: node "$CONTROL_ROOT/04_tools/release-engine/source-checkout-1-7.mjs" "$CONTROL_ROOT" "$RELEASE_TARGET" >> "$GITHUB_OUTPUT"
    - name: Load exact source
      if: inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry')
      uses: actions/checkout@v6
      with:
        ref: ${{ inputs.source-sha }}
        path: .runner-1-6/source
        fetch-depth: 2
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ steps.source_scope.outputs.paths }}
    - name: Mark shared release core started
      id: started
      shell: bash
      run: echo 'value=true' >> "$GITHUB_OUTPUT"
    - name: Run shared release core
      shell: bash
      env:
        CONTROL_ROOT: ${{ inputs.control-root != '' && inputs.control-root || github.workspace }}
        SOURCE_ROOT: ${{ inputs.source-sha != '' && (inputs.operation == 'release' || inputs.operation == 'retry') && format('{0}/.runner-1-6/source', github.workspace) || '' }}
        RELEASE_IDENTIFIER: ${{ inputs.identifier }}
        RELEASE_TARGET: ${{ inputs.target }}
        PHYSICAL_NODE: ${{ inputs.physical-node }}
        RUNNER_CLASS: ${{ inputs.runner-class }}
      run: |
        bash scripts/runner-1-6.sh "${{ inputs.operation }}"
