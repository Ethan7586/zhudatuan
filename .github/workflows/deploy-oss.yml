name: Legacy 1.2 - Build and Deploy via Wuhan OSS
run-name: LEGACY 1.2 build+deploy ${{ inputs.release_target }} ${{ inputs.head_sha || github.sha }}

# Legacy recovery path only. This workflow builds during deployment and includes
# aggregate targets, so it is never a 1.3/1.3.1 deployment entrypoint.

on:
  workflow_dispatch:
    inputs:
      release_target:
        description: Independently packaged runtime target
        required: true
        default: console-static
        type: choice
        options:
          - console-static
          - commerce-api
          - identity-api
          - workers
          - database-migrations
          - node-operations
      head_sha:
        description: Exact zdt-next commit; empty uses current zdt-next
        required: false
        type: string
      legacy_1_2_ack:
        description: Type legacy-1.2-build-and-deploy; never use this for a 1.3.1 deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: zdt-next-wuhan-oss-${{ inputs.release_target }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.22.0
  RELEASE_TARGET: ${{ inputs.release_target }}
  LEGACY_1_2_ACK: ${{ inputs.legacy_1_2_ack }}
  VITE_API_BASE_URL: https://api.hbbtzn.com
  VITE_AUTH_BASE_URL: https://accounts.hbbtzn.com

jobs:
  deploy:
    name: Build once → OSS → exact target switch
    runs-on: [self-hosted, linux, x64, zdt-aliyun-release]
    timeout-minutes: 12
    steps:
      - name: Refuse accidental use as a 1.3.1 deployment
        shell: bash
        run: |
          if [ "$LEGACY_1_2_ACK" != legacy-1.2-build-and-deploy ]; then
            echo "This is the legacy 1.2 build-and-deploy recovery path. Use prepare-artifact.yml and deploy-prepared.yml for 1.3.1." >&2
            exit 64
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ inputs.head_sha || 'zdt-next' }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build independent runtime artifact
        id: artifact
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          export VITE_CLIENT_VERSION="0.0.0-g${source_sha}"
          built_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p .oss-release/package
          if [ "$RELEASE_TARGET" = console-static ]; then
            npm run build:console
            printf '{"sourceSha":"%s","builtAt":"%s"}\n' "$source_sha" "$built_at" \
              > 01_core_hexin/apps/console/dist/release-version.json
            mkdir -p .oss-release/package/static
            cp -a 01_core_hexin/apps/console/dist/. .oss-release/package/static/
          else
            node 04_tools/scripts/release/build-runtime-bundle.mjs \
              "$RELEASE_TARGET" .oss-release/package "$source_sha"
          fi
          artifact_file=".oss-release/${RELEASE_TARGET}.tar.gz"
          tar -C .oss-release/package -czf "$artifact_file" .
          artifact_sha="$(sha256sum "$artifact_file" | awk '{print $1}')"
          object="zdt-next/${RELEASE_TARGET}/${source_sha}/${artifact_sha}.tar.gz"
          manifest_object="zdt-next/${RELEASE_TARGET}/${source_sha}/${artifact_sha}.json"
          printf '{"target":"%s","sourceSha":"%s","artifactSha256":"%s","object":"%s","builtAt":"%s"}\n' \
            "$RELEASE_TARGET" "$source_sha" "$artifact_sha" "$object" "$built_at" > .oss-release/manifest.json
          {
            printf 'source_sha=%s\n' "$source_sha"
            printf 'artifact_sha=%s\n' "$artifact_sha"
            printf 'object=%s\n' "$object"
            printf 'manifest_object=%s\n' "$manifest_object"
          } >> "$GITHUB_OUTPUT"

      - name: Upload immutable artifact to Wuhan OSS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
        run: |
          set -euo pipefail
          node 04_tools/scripts/release/oss-artifact.mjs upload \
            --file ".oss-release/${RELEASE_TARGET}.tar.gz" \
            --object "${{ steps.artifact.outputs.object }}" \
            --content-type application/gzip
          node 04_tools/scripts/release/oss-artifact.mjs upload \
            --file .oss-release/manifest.json \
            --object "${{ steps.artifact.outputs.manifest_object }}" \
            --content-type application/json

      - name: Switch exact runtime target on ECS
        env:
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          RELEASE_SSH_KEY: ${{ secrets.ZDT_RELEASE_SSH_KEY }}
          ARTIFACT_SHA: ${{ steps.artifact.outputs.artifact_sha }}
          SOURCE_SHA: ${{ steps.artifact.outputs.source_sha }}
          ARTIFACT_OBJECT: ${{ steps.artifact.outputs.object }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$RELEASE_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          ssh-keyscan -H 123.57.232.253 >> "$HOME/.ssh/known_hosts"
          artifact_url="$(node 04_tools/scripts/release/oss-artifact.mjs sign-get --object "$ARTIFACT_OBJECT" --ttl 900)"
          case "$RELEASE_TARGET" in
            console-static) activation_script=04_tools/scripts/release/activate-console-static.sh ;;
            database-migrations) activation_script=04_tools/scripts/release/activate-database-migrations.sh ;;
            node-operations) activation_script=04_tools/scripts/release/activate-node-operations.sh ;;
            commerce-api|identity-api|workers) activation_script=04_tools/scripts/release/activate-runtime-bundle.sh ;;
            *) echo "Unsupported release target: $RELEASE_TARGET" >&2; exit 1 ;;
          esac
          {
            printf 'ARTIFACT_URL=%q\n' "$artifact_url"
            printf 'ARTIFACT_SHA=%q\n' "$ARTIFACT_SHA"
            printf 'SOURCE_SHA=%q\n' "$SOURCE_SHA"
            printf 'RELEASE_TARGET=%q\n' "$RELEASE_TARGET"
            cat "$activation_script"
          } | ssh root@123.57.232.253 'bash -s' | tee .oss-release/deploy-result.txt
          {
            printf '### 武汉 OSS 独立制品发布完成\n\n'
            printf -- '- 目标：`%s`\n' "$RELEASE_TARGET"
            printf -- '- 源版本：`%s`\n' "$SOURCE_SHA"
            printf -- '- 制品 SHA256：`%s`\n' "$ARTIFACT_SHA"
            printf -- '- OSS 对象：`%s`\n' "$ARTIFACT_OBJECT"
            grep -E '^(DEPLOYED_|CURRENT_|ROLLBACK_|PREVIOUS_)' .oss-release/deploy-result.txt | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
